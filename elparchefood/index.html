<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Este archivo NO se guarda en cache. Es de 15 lineas y es el que dice que
     version de la aplicacion cargar; si el navegador se queda con una copia
     vieja, sigue pidiendo la version anterior y los cambios nunca llegan
     aunque esten publicados. Paso el 6-ago-2026: el codigo nuevo estaba
     desplegado y Sergio seguia viendo las pantallas viejas.
     La aplicacion (app-cliente.js/css) SI se cachea, y se renueva con el ?v=. -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>El Parche Food</title>
<!-- La página de UN restaurante.
     Este archivo es lo único propio de cada uno: dice de quién es y carga la
     aplicación, que es compartida y vive en la raíz. Así, cuando se mejora la
     página, se mejora para todos los restaurantes a la vez — no hay que tocar
     una carpeta por cliente. -->
<!-- QUE SE INSTALE COMO APP, CON EL LOGO DEL RESTAURANTE.
     El manifest y los iconos viven en ESTA carpeta, no en la raiz: la pagina es
     la misma para todos los restaurantes, y el icono no. A El Parche le queda
     el logo de El Parche; el dia que entre otro, el suyo.
     Esto NO tiene nada que ver con los iconos del .exe ni del APK: aquellos van
     incrustados al compilar y no comparten un solo archivo con este.
     Todavia SIN service worker (decision de Sergio): que se instale primero;
     lo de funcionar sin internet va despues, que es lo que se puede dañar. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#08080a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icono-512.png">
<!-- iPhone IGNORA el manifest para el icono de inicio: necesita esta etiqueta
     aparte. Sin ella, en iPhone quedaria una miniatura de la pantalla. -->
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="El Parche">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="app"></div>
<script>window.COBRA_SLUG = 'elparchefood';</script>
<!-- LOS DOS VIDEOS DEL TUTORIAL DE INSTALACION.

     Aqui van porque este archivo es lo unico propio de cada restaurante: la
     aplicacion es la misma para todos y no puede traer la direccion de El
     Parche quemada dentro.

     A donde apunta: al boton de la plantilla de WhatsApp que se le manda a
     quien se registro y no instalo la app. Ese boton lleva a
         https://cobrapos.app/elparchefood/#instalar
     y ahi la aplicacion muestra el video que corresponda al telefono de la
     persona, con los pasos escritos debajo y el boton de instalar.

     Los archivos viven en Supabase Storage, bucket `chat-media`, que ya es
     publico. Se suben y quedan con una direccion asi:
         https://tblujfduscslxjmrjbdr.supabase.co/storage/v1/object/public/chat-media/instalar-iphone.mp4

     MIENTRAS ESTEN VACIOS la pantalla se ve completa igual, solo con el
     titulo y los pasos: no sale un recuadro negro ni un "aqui va el video".
     Grabarlos verticales (9:16), de 30 a 60 segundos, con letras en pantalla
     —casi todos los ven sin sonido— y livianos, entre 5 y 10 MB: muchos los
     van a abrir con datos.

     Tienen que ser DOS y distintos: en iPhone se instala por Compartir ->
     Agregar a inicio, y en Android por los tres puntos -> Instalar. -->
<script>
  window.COBRA_TUTORIAL = {
    /* Grabado por Sergio el 23-ago-2026. El original venia en 4K (2160x3840,
       31 MB); se reencodo a 720x1280 y 4 MB, que es lo mismo de ver en un
       celular y ocho veces menos datos. Los 79 segundos y las letras se
       leen igual — se comprobo mirando un fotograma del medio. */
    ios:     'https://tblujfduscslxjmrjbdr.supabase.co/storage/v1/object/public/chat-media/tutorial/instalar-iphone.mp4',
    /* Falta grabar el de Android. Mientras este vacio, a quien entre desde
       un Android no le sale ningun video: solo los pasos escritos, que para
       Android son otros (tres puntos -> Instalar). Poner aqui el de iPhone
       seria peor que no poner nada. */
    android: ''
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<!-- EL ?v= SE CALCULA SOLO (16-ago). Antes era un numero escrito a mano que
     habia que subir en cada despliegue... y nadie lo subia: quedo congelado en
     1790120000 y los navegadores siguieron sirviendo la aplicacion VIEJA
     durante dias, con los arreglos ya publicados. Se comprobo pidiendo el mismo
     archivo con y sin ese ?v=: llegaban dos versiones distintas.
     Ahora la marca es la FECHA Y HORA: como este index no se cachea, cada
     visita pide la aplicacion con la marca de la hora en curso, asi que un
     cambio publicado llega a todos en menos de una hora sin tocar nada, y
     dentro de la misma hora el archivo se sigue cacheando (no se gasta datos
     del cliente en cada pantalla). document.write mantiene el ORDEN: la
     aplicacion tiene que cargar despues de supabase, como estaba. -->
<script>
  (function () {
    /* EL SELLO manda sobre la hora (19-ago). La marca horaria sola dejaba
       hasta 60 minutos de aplicacion vieja en los celulares que ya la tenian
       abierta — y probando un arreglo, esa hora se vuelve "no funciona" cuando
       en realidad ya estaba corregido: paso con los avisos de Sergio.
       El sello se sube A MANO en cada cambio de la aplicacion; la hora sigue
       ahi detras como red, para que un olvido cueste una hora y no la eternidad. */
    var SELLO = '0823l';
    var v = SELLO + new Date().toISOString().slice(0, 13).replace(/\D/g, '');   // sello + AAAAMMDDHH
    document.write('<link rel="stylesheet" href="../app-cliente.css?v=' + v + '">');
    document.write('<scr' + 'ipt src="../app-cliente.js?v=' + v + '"><\/scr' + 'ipt>');
  })();
</script>
</body>
</html>
