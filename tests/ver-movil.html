<!doctype html>
<meta charset="utf-8">
<title>La banda de quien llevo el domicilio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;padding:30px;background:#F8FAFC;font-family:'DM Sans',system-ui,sans-serif}
 #panel{background:#fff;border-radius:14px;padding:18px;max-width:420px;border:1px solid #ECEEF2}
 #reg{margin-top:16px;font-size:13px;color:#475569;white-space:pre-line}</style>
<body>
<div id="panel">
  <div style="font-size:12px;color:#94A3B8">CAJERO</div>
  <div style="font-weight:700;margin-bottom:10px">Chat IA</div>
  <div id="zona"></div>
  <div style="margin-top:14px;font-size:12px;color:#94A3B8">COMANDA</div>
</div>
<div id="reg">Toca la banda y luego el desplegable.</div>
<script>
// Se finge lo minimo que el editor necesita del modulo grande.
var _esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
var state = { deliveries: [{ id:'x1', movil:'16', empresaId:'' }] };
var _vsEmpresas = [{id:'e1',nombre:'Inter Domiciliarios'},{id:'e2',nombre:'Rappi Service'}];
async function vsEmpresas(){ return _vsEmpresas; }
window.vsMovilTexto = function (d) {
  if (!d || !d.movil) return '+ Quién lo llevó';
  var e = (_vsEmpresas||[]).find(x => String(x.id)===String(d.empresaId));
  return e ? (_esc(e.nombre)+' · Móvil '+_esc(d.movil)) : ('Lo llevó el Móvil '+_esc(d.movil));
};
var log = [];
function reg(t){ log.push(t); document.getElementById('reg').textContent = log.join('\n'); }
// El panel se cierra con cualquier clic que le llegue — como en Ventas.
document.getElementById('panel').addEventListener('click', function(){ reg('✗ EL PANEL SE CERRO'); });
</script>
<script src="../modules/ventas-salon-movil-test.js"></script>
<script>
var d = state.deliveries[0];
document.getElementById('zona').innerHTML =
  '<button type="button" onclick="window.vsMovilEditar(this, &quot;x1&quot;)" style="margin:4px 0 0;border:none;'
  + 'cursor:pointer;font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;font-family:inherit;'
  + 'color:#7C3AED;background:#F5F3FF">' + window.vsMovilTexto(d) + '</button>';
</script>
