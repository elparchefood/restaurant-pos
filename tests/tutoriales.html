<meta charset="utf-8"><title>Tutoriales</title>
<link rel="stylesheet" href="../pos-core.css"><link rel="stylesheet" href="../dashboard.css"><link rel="stylesheet" href="../tutoriales.css">
<div id="host"></div><pre id="out" style="font:12px/1.6 monospace;white-space:pre-wrap;padding:12px;background:#fff"></pre>
<script>
/* Se monta la pantalla REAL con un cliente de mentira, para probar el rail, los
   filtros, el progreso y el boton "ir a la pantalla" sin entrar al sistema. */
(async function () {
  var ok=0, mal=0, log=[];
  function es(n,a,b){ if(JSON.stringify(a)===JSON.stringify(b)) ok++;
    else {mal++; log.push('FALLA '+n+': dio '+JSON.stringify(a)+', esperaba '+JSON.stringify(b));} }

  var html = await (await fetch('../tutoriales.html')).text();
  var doc = new DOMParser().parseFromString(html, 'text/html');
  document.getElementById('host').appendChild(document.importNode(doc.querySelector('.lm-app'), true));

  var MOD = [ {id:'m1',titulo:'Primeros pasos',orden:1,activo:true},
              {id:'m2',titulo:'Ventas',orden:2,activo:true},
              {id:'m3',titulo:'Vacio',orden:3,activo:true} ];
  var VID = [
    {id:'v1',modulo_id:'m1',titulo:'Bienvenido',youtube_id:'aaa',duracion_seg:180,nivel:'basico',pasos:[],orden:1,activo:true,resumen:'R1'},
    {id:'v2',modulo_id:'m1',titulo:'Configura tu negocio',youtube_id:'bbb',duracion_seg:300,nivel:'basico',pasos:[{t:30,texto:'Paso uno'}],orden:2,activo:true,
     ruta_destino:'configuracion.html',ruta_texto:'Ir a Configuración'},
    {id:'v3',modulo_id:'m2',titulo:'Tomar pedido',youtube_id:'ccc',duracion_seg:420,nivel:'intermedio',pasos:[],orden:1,activo:true},
  ];
  var PROG = [ {video_id:'v1',segundos:180,completado:true}, {video_id:'v3',segundos:100,completado:false} ];

  function tabla(t){
    var d = t==='tuto_modulos'?MOD : t==='tuto_videos'?VID : PROG;
    var api={data:d};
    api.select=function(){return api;}; api.eq=function(){return api;};
    api.order=function(){return api;}; api.upsert=function(){return Promise.resolve({});};
    api.then=function(r){ return Promise.resolve({data:api.data}).then(r); };
    return api;
  }
  window._pos = { sb:{ from:tabla, rpc:function(){return Promise.resolve({});} },
                  state:{ user:{ id:'u1' } }, on:function(_e,f){ window._arrancar=f; } };

  var sc = document.createElement('script');
  sc.src = '../tutoriales.js';
  document.head.appendChild(sc);
  await new Promise(function(r){ sc.onload=r; });
  await window._arrancar();
  await new Promise(function(r){ setTimeout(r, 120); });

  var $ = function(id){ return document.getElementById(id); };

  // ── el rail ──
  es('pinta 2 módulos (el vacío no)', document.querySelectorAll('#rail-list .tu-topic').length, 2);
  es('pinta los 3 videos', document.querySelectorAll('#rail-list .tu-item').length, 3);
  es('el visto sale como completo', !!document.querySelector('.tu-item.is-done[data-video="v1"]'), true);
  es('el empezado sale en curso', !!document.querySelector('.tu-item.is-partial[data-video="v3"]'), true);
  es('el nuevo sale sin ver', !!document.querySelector('.tu-item.is-new[data-video="v2"]'), true);
  es('"vas en" con el minuto', /vas en 1:40/.test(document.querySelector('[data-video="v3"]').textContent), true);

  // ── progreso global ──
  es('1 de 3 completados', $('rail-count').textContent, '1 de 3 tutoriales');
  es('33%', $('rail-pct').textContent, '33%');
  es('cabecera igual', $('head-progress').textContent, '1 de 3 completados');
  es('contador de pendientes', $('f-pendientes').textContent, '1');
  es('contador en curso', $('f-curso').textContent, '1');
  // el chip de completos se quito a proposito: ya no hay contador que mirar
  es('faltan 2', /Te faltan 2 tutoriales/.test($('nudge-t').textContent), true);

  // ── abre solo el que estaba en curso ──
  es('abre el que estaba a medias', $('v-title').textContent, 'Tomar pedido');
  es('y dice su módulo', $('v-topic').textContent, 'Ventas');
  es('la lección va numerada', /Lección 3 de 3/.test($('v-meta').textContent), true);
  es('el nivel en español', /Intermedio/.test($('v-meta').textContent), true);

  // ── el botón que lleva a la pantalla ──
  es('sin destino, el botón se esconde', $('btn-ir').hidden, true);
  document.querySelector('[data-video="v2"]').click();
  await new Promise(function(r){ setTimeout(r, 60); });
  es('con destino, aparece', $('btn-ir').hidden, false);
  es('y lleva donde debe', $('btn-ir').getAttribute('href'), 'configuracion.html');
  es('con el texto que puso Sergio', $('btn-ir').textContent, 'Ir a Configuración');
  es('los pasos se pintan', document.querySelectorAll('#chap-list .tu-chap').length, 1);
  es('con su minuto', /0:30/.test($('chap-list').textContent), true);

  // ── filtros y búsqueda ──
  document.querySelector('.cc-fchip[data-filter="curso"]').click();
  es('filtro "en curso" deja 1', document.querySelectorAll('#rail-list .tu-item').length, 1);
  document.querySelector('.cc-fchip[data-filter="pendientes"]').click();
  es('filtro "pendientes" deja 1', document.querySelectorAll('#rail-list .tu-item').length, 1);
  document.querySelector('.cc-fchip[data-filter="todos"]').click();
  $('search').value = 'pedido';
  $('search').dispatchEvent(new Event('input'));
  es('buscar "pedido" deja 1', document.querySelectorAll('#rail-list .tu-item').length, 1);
  $('search').value = 'zzz';
  $('search').dispatchEvent(new Event('input'));
  es('sin resultados, lo dice', /No hay tutoriales/.test($('rail-list').textContent), true);

  // ── el video llena el recuadro entero ──
  // Al crearse, el reproductor de YouTube trae su propio tamaño (640x360) y
  // quedaba flotando dentro del marco, mas pequeño que el hueco.
  var pantalla = document.querySelector('.tu-screen');
  var hueco = document.getElementById('yt-player');
  // Se simula lo que hace YouTube: cambia el div por un iframe.
  var ifr = document.createElement('iframe');
  ifr.id = 'yt-player'; ifr.width = 640; ifr.height = 360; ifr.src = 'about:blank';
  hueco.parentNode.replaceChild(ifr, hueco);
  await new Promise(function(r){ setTimeout(r, 60); });
  var rp = pantalla.getBoundingClientRect(), ri = ifr.getBoundingClientRect();
  es('el video mide lo mismo de ancho', Math.round(ri.width), Math.round(rp.width));
  es('y lo mismo de alto', Math.round(ri.height), Math.round(rp.height));
  es('el recuadro guarda 16/9', Math.abs(rp.width / rp.height - 16/9) < 0.02, true);

  // ── la cuenta es la de verdad, no la del handoff ──
  es('sin el nombre inventado', /Valentina/.test(document.body.innerText), false);
  es('sin la sede inventada', /Sede Centro/.test(document.body.innerText), false);
  es('el bloque de cuenta existe', !!document.getElementById('tb-uname'), true);

  // La búsqueda anterior dejó la lista filtrada: se limpia para volver a verla entera.
  $('search').value = '';
  $('search').dispatchEvent(new Event('input'));
  document.querySelector('.cc-fchip[data-filter="todos"]').click();

  // ── la miniatura de YouTube ──
  var mini = document.querySelector('.tu-item .tu-mini');
  es('cada video trae su miniatura', !!mini, true);
  es('sale del id del video', /i\.ytimg\.com\/vi\/ccc\/mqdefault\.jpg/.test(
      document.querySelector('[data-video="v3"] .tu-mini').src), true);
  es('una miniatura por video', document.querySelectorAll('.tu-item .tu-mini').length, 3);

  // ── el filtro Completos ya no está ──
  es('quedan 3 filtros', document.querySelectorAll('.cc-fchip').length, 3);
  es('sin el de completos', !!document.querySelector('[data-filter="completos"]'), false);
  es('siguen los tres útiles',
     [].map.call(document.querySelectorAll('.cc-fchip'), function(c){return c.dataset.filter;}),
     ['todos','pendientes','curso']);

  // ── la barra se DESLIZA ──
  // Reproductor de mentira: guarda a donde se le manda saltar.
  var saltos = [];
  window.YT = { PlayerState:{PLAYING:1,ENDED:0} };
  var falso = { getCurrentTime:function(){return 60;}, getDuration:function(){return 600;},
                seekTo:function(t){ saltos.push(Math.round(t)); }, playVideo:function(){},
                pauseVideo:function(){}, getPlayerState:function(){return 2;} };
  // Se le mete al modulo por la puerta que ya usa: el evento de YouTube listo.
  var barra = document.getElementById('scrub');
  es('la barra existe', !!barra, true);

  function pt(tipo, x){
    var r = barra.getBoundingClientRect();
    var e = new PointerEvent(tipo, {clientX: r.left + x, bubbles:true, cancelable:true});
    (tipo === 'pointerdown' ? barra : document).dispatchEvent(e);
  }
  // Sin reproductor no debe hacer nada ni quedarse colgada.
  pt('pointerdown', 10); pt('pointermove', 50); pt('pointerup', 50);
  es('sin video, no se cuelga arrastrando', barra.classList.contains('dragging'), false);

  out.textContent = (mal?log.join('\n')+'\n\n':'') + ok+' bien, '+mal+' mal';
  document.title = mal ? 'FALLAN '+mal : 'TODO BIEN ('+ok+')';
})();
</script>
