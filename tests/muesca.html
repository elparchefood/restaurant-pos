<meta charset="utf-8"><title>Muesca</title>
<script>document.documentElement.className = 'tema-claro';</script>
<link rel="stylesheet" href="../app-cliente.css">
<div class="ep-app"><div class="ep-cuerpo"><div class="ep-scroll" style="padding:20px">
  <div class="ep-over">
    <div class="ep-wcard-wrap"><div class="ep-wcard">
      <div class="ep-wc-lbl">Saldo disponible</div>
      <div class="ep-wc-monto">$48.000</div>
      <div class="ep-wc-nom">Sergio</div>
    </div><button class="ep-wc-btn">Recargar</button></div>
    <div class="ep-pts-wrap"><div class="ep-pts-hero">
      <div class="ep-pts-lbl">Mis puntos</div>
      <div class="ep-pts-num">340<span>pts</span></div>
    </div><button class="ep-pts-btn">R</button></div>
  </div>
</div></div></div>
<pre id="out" style="font:12px/1.6 monospace;padding:12px"></pre>
<script>
/* La muesca de las tarjetas tiene que ser un HUECO, no un relleno: por ahi se
   ve el fondo de la pagina, sea el que sea. Aqui se comprueba que la mascara
   este puesta y que el boton no quede dentro del recorte. */
setTimeout(function () {
  var g = function (el, p) { return getComputedStyle(el)[p]; };
  var card = document.querySelector('.ep-wcard');
  var btn = document.querySelector('.ep-wc-btn');
  var pts = document.querySelector('.ep-pts-hero');
  var ok = 0, mal = 0, log = [];
  function es(n, a, b) { if (a === b) ok++; else { mal++; log.push('FALLA ' + n + ': ' + JSON.stringify(a)); } }

  var m1 = g(card, 'maskImage') || g(card, 'webkitMaskImage');
  var m2 = g(pts, 'maskImage') || g(pts, 'webkitMaskImage');
  es('la tarjeta de saldo lleva mascara', m1 !== 'none' && !!m1, true);
  es('la de puntos tambien', m2 !== 'none' && !!m2, true);
  es('la mascara tiene sus 5 capas', (m1.match(/gradient/g) || []).length, 5);
  es('ya no se pinta la muesca', document.querySelectorAll('.ep-wc-cut, .ep-pts-cut').length, 0);
  es('el boton NO va dentro de la tarjeta', card.contains(btn), false);

  var rc = card.getBoundingClientRect(), rb = btn.getBoundingClientRect();
  es('pero cae en la esquina de abajo a la derecha',
     rb.right <= rc.right + 2 && rb.right > rc.right - 160 && rb.bottom <= rc.bottom + 2, true);

  document.getElementById('out').textContent =
    (mal ? log.join('\n') + '\n\n' : '') + ok + ' bien, ' + mal + ' mal' +
    '\n\nmascara: ' + m1.slice(0, 110);
  document.title = mal ? 'FALLAN ' + mal : 'TODO BIEN (' + ok + ')';
}, 200);
</script>
