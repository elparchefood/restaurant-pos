<meta charset="utf-8"><title>Tarjetas</title>
<link rel="stylesheet" href="../app-cliente.css">
<div class="ep-app"><div class="ep-cuerpo"><div class="ep-scroll" style="padding:20px">
  <div class="ep-over" id="over"></div>
</div></div></div>
<pre id="out" style="font:12px/1.6 monospace;padding:12px"></pre>
<script>
(async function () {
  var js = await (await fetch('../app-cliente.js?t=' + Date.now())).text();
  var ok=0, mal=0, log=[];
  function es(n,a,b){ if(a===b) ok++; else {mal++; log.push('FALLA '+n+': '+JSON.stringify(a));} }

  // El marcado tiene que seguir la regla del handoff.
  es('el boton de recargar es HERMANO, no hijo',
     /'<\/div>' \+\s*\n\s*'<button class="ep-wc-cta"/.test(js), true);
  es('el boton de puntos tambien',
     /'<\/div>' \+\s*\n\s*'<button class="ep-pts-orb"/.test(js), true);
  es('la tarjeta va dentro de su wrap', /ep-wc-wrap"><div class="ep-wcard"/.test(js), true);
  es('la de puntos tambien', /ep-pts-wrap"><div class="ep-pts-hero"/.test(js), true);

  // Y el recorte tiene que estar puesto.
  var css = await (await fetch('../app-cliente.css?t=' + Date.now())).text();
  es('la muesca se recorta con mascara', /-webkit-mask|mask-composite/.test(css), true);

  document.getElementById('over').innerHTML =
    '<div class="ep-wc-wrap"><div class="ep-wcard">' +
      '<div class="ep-wc-head"><span class="ep-wc-brand">EL PARCHE</span></div>' +
      '<span class="ep-wc-lbl">Saldo disponible</span>' +
      '<div class="ep-wc-bal"><span class="ep-wc-amt">$48.000</span></div>' +
      '<div class="ep-wc-holder">Sergio</div>' +
    '</div><button class="ep-wc-cta">Recargar</button></div>' +
    '<div class="ep-pts-wrap"><div class="ep-pts-hero">' +
      '<span class="ep-pts-big">340<small>pts</small></span>' +
    '</div><button class="ep-pts-orb">R</button></div>';
  await new Promise(function(r){ setTimeout(r,120); });

  var card = document.querySelector('.ep-wcard');
  var btn = document.querySelector('.ep-wc-cta');
  var g = getComputedStyle(card);
  es('la tarjeta lleva el recorte', (g.maskImage||g.webkitMaskImage) !== 'none', true);
  es('el boton NO esta dentro de la tarjeta', card.contains(btn), false);
  es('el boton se ve (opaco)', getComputedStyle(btn).backgroundColor.indexOf('rgba(0, 0, 0, 0)') < 0, true);

  document.getElementById('out').textContent =
    (mal?log.join('\n')+'\n\n':'') + ok+' bien, '+mal+' mal';
  document.title = mal ? 'FALLAN '+mal : 'TODO BIEN ('+ok+')';
})();
</script>
