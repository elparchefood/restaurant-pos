<meta charset="utf-8"><title>Fotos de la página</title>
<pre id="out" style="font:12px/1.6 monospace;white-space:pre-wrap;padding:12px"></pre>
<script>
(async function () {
  var ok=0, mal=0, log=[];
  function es(n,a,b){ if(JSON.stringify(a)===JSON.stringify(b)) ok++;
    else {mal++; log.push('FALLA '+n+': dio '+JSON.stringify(a)+', esperaba '+JSON.stringify(b));} }

  var js = await (await fetch('../app-cliente.js?t=' + Date.now())).text();

  // ── 1) la foto del restaurante llega de VERDAD del servidor ──
  var SB='https://tblujfduscslxjmrjbdr.supabase.co';
  var ANON=(js.match(/ANON\s*=\s*'([^']+)'/)||[])[1];
  es('la página trae su llave pública', !!ANON, true);
  var r = await fetch(SB+'/rest/v1/rpc/fn_web_publica', {
    method:'POST', headers:{apikey:ANON,'Content-Type':'application/json'},
    body: JSON.stringify({p_slug:'elparchefood'})
  }).then(function(x){return x.json();});
  var neg = r && r[0];
  es('el servidor responde', !!neg, true);
  es('y manda el logo del restaurante', /storage\/v1\/object\/public\/marca\//.test(neg.logo||''), true);
  es('con el nombre de la marca', neg.nombre, 'El Parche Food');

  // ── 2) la página lo usa en los tres sitios ──
  es('la cabecera pinta el logo', /ep-marca-img[\s\S]{0,120}e\.logo|e\.logo[\s\S]{0,120}ep-marca-img/.test(js), true);
  es('el menú lateral también', /ep-side-logo[\s\S]{0,200}S\.negocio && S\.negocio\.logo/.test(js), true);

  // ── 3) la foto del cliente ──
  es('arriba a la derecha ya no está el pin', /data-ir="local">' \+ ico\('pin', 17\)/.test(js), false);
  es('y en su lugar va la foto del cliente', /ep-redondo ep-yo[\s\S]{0,160}c\.foto/.test(js), true);
  es('que lleva al perfil', /ep-yo" data-ir="perfil"/.test(js), true);
  es('el perfil deja cambiarla', /id="pf-foto"/.test(js), true);

  // ── 4) se achica antes de mandarla ──
  es('hay recorte antes de subir', /function achicar/.test(js), true);
  es('a 256 px', /achicar\(archivo, 256\)/.test(js), true);
  es('recorta cuadrado desde el centro', /im\.width - m\) \/ 2/.test(js), true);
  es('la manda como jpeg comprimido', /toDataURL\('image\/jpeg', 0\.82\)/.test(js), true);

  // ── 5) el servidor rechaza lo que no debe ──
  var mala = await fetch(SB+'/functions/v1/web-acceso', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({accion:'foto', token:'inventado', foto:'data:image/jpeg;base64,AAAA'})
  }).then(function(x){return x.json();});
  es('sin sesión válida no deja subir', mala.ok, false);
  var mala2 = await fetch(SB+'/functions/v1/web-acceso', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({accion:'foto', token:'inventado', foto:'esto no es una imagen'})
  }).then(function(x){return x.json();});
  es('una imagen inválida tampoco', mala2.ok, false);

  // ── lo que se quito del saludo ──
  es('el saludo ya no repite la foto', /ep-saludo">' \+[\s\S]{0,80}ep-avatar"/.test(js), false);
  es('arriba a la derecha ya no esta cerrar sesion',
     /ep-saludo-btns[\s\S]{0,400}data-salir/.test(js), false);
  es('pero sigue en el menu de la izquierda', /ep-nav" data-salir="1"/.test(js), true);
  es('y en el perfil', /data-salir="1">Cerrar sesión/.test(js), true);
  var arriba = (js.match(/ep-saludo-btns[\s\S]{0,700}/) || [''])[0];
  es('arriba queda el boton de tema', /ep-tema/.test(arriba), true);
  es('y la foto del cliente', /ep-yo/.test(arriba), true);

  // ── la foto en TODAS las pantallas ──
  es('los botones de arriba viven en un solo sitio', /function botonesArriba/.test(js), true);
  es('el inicio los usa', /'<div class="ep-saludo">' \+[\s\S]{0,400}botonesArriba\(\)/.test(js), true);
  es('y las demas pantallas tambien', /function encabezado[\s\S]{0,400}botonesArriba\(/.test(js), true);
  es('no quedaron dos copias de la foto',
     (js.match(/ep-redondo ep-yo/g) || []).length, 1);

  // ── la muesca de las tarjetas ──
  es('la tarjeta de saldo ya no la dibuja', /ep-wc-cut"><\/div>/.test(js), false);
  es('la de puntos tampoco', /ep-pts-cut"><\/div>/.test(js), false);
  var css = await (await fetch('../app-cliente.css?t=' + Date.now())).text();
  es('y el estilo la apaga', /\.ep-wc-cut, \.ep-pts-cut \{ display: none/.test(css), true);

  out.textContent = (mal?log.join('\n')+'\n\n':'') + ok+' bien, '+mal+' mal';
  document.title = mal ? 'FALLAN '+mal : 'TODO BIEN ('+ok+')';
})();
</script>
