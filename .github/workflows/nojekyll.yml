# ══════════════════════════════════════════════════════════════════════
#  EL CENTINELA DEL .nojekyll
#
#  Sin ese archivo, GitHub Pages pasa el sitio por Jekyll, que interpreta
#  las llaves {{ }} y {% %} de los .md y REVIENTA la publicacion. Pasó el
#  22-ago-2026: se borró en un commit y hubo 8 publicaciones fallidas
#  seguidas — el frontend de ese día nunca salió y nadie se enteró hasta
#  que Sergio preguntó por los correos de error.
#
#  Este centinela falla el build A PROPOSITO si el archivo no está, para
#  que el error se vea ANTES de que el sitio se caiga, no después.
# ══════════════════════════════════════════════════════════════════════
name: El .nojekyll tiene que estar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ¿Está el .nojekyll?
        run: |
          if [ ! -f .nojekyll ]; then
            echo "::error::Falta el archivo .nojekyll en la raíz."
            echo "Sin él, GitHub Pages pasa el sitio por Jekyll y la publicación falla."
            echo "Solución: crear un archivo vacío llamado .nojekyll en la raíz del repo."
            echo "El porqué completo está en NOJEKYLL.md"
            exit 1
          fi
          echo "✓ .nojekyll presente — la publicación no pasará por Jekyll."
