<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Productos — Cobra POS</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/brand/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/brand/favicon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="catalogo-productos.css?v=1790900000">
</head>
<body>

<div class="cp-root">

  <!-- ── Sidebar ── -->
  <nav class="cp-sidebar">
    <div class="cp-brand">
      <div class="cp-brand-logo" style="background:transparent;box-shadow:none;padding:0;overflow:hidden"><img src="assets/brand/cobra-logo.png?v=2" alt="Cobra POS" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block"></div>
      <div>
        <div class="cp-brand-name">Cobra POS</div>
        <div class="cp-brand-sub">Cargando…</div>
      </div>
    </div>
    <!-- Aqui iba un rotulo que decia "Catalogo": sobraba. La pantalla ya se
         llama asi en el titulo y en la migaja de arriba. -->
    <div id="cp-nav"><!-- renderNav() --></div>
    <!-- El pie: la cuenta que tiene la sesion abierta, igual que en el
         dashboard y en Ventas. Antes aqui iba una fila con cuantos productos,
         categorias y grupos hay — informacion que ya esta en las insignias de
         cada renglon del menu, dos centimetros mas arriba. -->
    <div class="cp-sidebar-footer">
      <div class="cp-user-row">
        <div class="cp-avatar" id="user-avatar">?</div>
        <div class="cp-user-info">
          <span class="cp-user-name" id="cp-user-nom">Cargando…</span>
          <span class="cp-user-role" id="cp-user-rol">—</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- ── Main ── -->
  <div class="cp-main">

    <!-- Topbar -->
    <header class="cp-topbar">
      <div class="cp-topbar-left">
        <span class="cp-mode-badge">Admin</span>
        <span class="cp-crumb-sep"></span>
        <span class="cp-crumb-base">Menú</span>
        <span class="cp-crumb-arrow">›</span>
        <span class="cp-crumb-current" id="crumb-title">Catálogo</span>
      </div>
      <div class="cp-topbar-right">
        <div class="cp-sync-pill">
          <span class="cp-sync-dot"></span>Sincronizado
        </div>
        <div class="cp-ram-chip">RAM libre</div>
        <div class="cp-user-chip">
          <div class="cp-chip-avatar">EP</div>
          <span class="cp-chip-name" data-negocio>Mi negocio</span>
        </div>
      </div>
    </header>

    <!-- Page content -->
    <div class="cp-content">
      <div class="cp-page-head">
        <div class="cp-head-text">
          <div class="cp-eyebrow">Menú<span data-negocio-suf></span></div>
          <h1 class="cp-page-title" id="page-title">Catálogo de productos</h1>
        </div>
        <div class="cp-page-actions" id="page-actions"><!-- renderPageHead() --></div>
      </div>

      <div class="cp-tabs-row" id="cp-tabs-row"><!-- renderTabsRow() --></div>
      <div class="cp-filter-row" id="cp-filter-row"><!-- renderFilterRow() --></div>
      <div class="cp-body" id="cp-body"><!-- renderBody() --></div>
    </div>

  </div><!-- /cp-main -->

</div><!-- /cp-root -->

<!-- Overlay root -->
<div id="cp-overlay"></div>

<!-- Toast -->
<div id="cp-toast" style="display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:600;display:none;align-items:center;gap:8px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.22);white-space:nowrap"></div>

<script src="vendor/supabase-2.js?v=1789520000"></script>
<script src="pos-nucleo.js?v=1798770000"></script>
<script>if(window.posRequirePin) posRequirePin('catalogo.ver');</script>
<script src="catalogo-productos.js?v=1792030000"></script>
<!-- Precio por sucursal. Va DESPUES: usa S, icon, fmt y openOverlay del anterior. -->
<script src="catalogo-sede.js?v=1798540000"></script>

</body>
</html>
