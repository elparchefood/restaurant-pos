<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservas · Cobra POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pos-core.css">
<link rel="stylesheet" href="reservas.css">
</head>
<body>
<div id="app">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="brand-mark">
      <div class="brand-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M6 2v6a3 3 0 0 0 6 0V2"/><path d="M9 2v20"/><path d="M17 2v10"/><path d="M17 12c0 5 4 5 4 0V2h-4"/></svg>
      </div>
      <div>
        <div class="brand-name" id="sb-brand">Comanda</div>
        <div class="brand-ver">POS · v1.0</div>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Operacion</div>
      <a class="nav-item" href="dashboard.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Escritorio
      </a>
      <a class="nav-item" href="ventas.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        Ventas
      </a>
      <a class="nav-item active" href="reservas.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Reservas
      </a>
      <a class="nav-item" href="domicilios.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Domicilio
      </a>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Backoffice</div>
      <a class="nav-item" href="informes.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Informes
      </a>
      <a class="nav-item" href="historial.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Historial
      </a>
    </div>
    <div class="sidebar-section sidebar-section--bottom">
      <a class="nav-item" href="configuracion.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Configuración
      </a>
    </div>
    <div class="sys-status">
      <div class="sys-row"><span>Sistema</span><span id="sb-status" style="color:#F97316">cargando...</span></div>
      <div class="sys-meta"><span id="sb-user">—</span><span>v1.0.0</span></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main id="main">
    <header id="topbar">
      <div class="topbar-left">
        <div>
          <div class="branch-eyebrow">Operacion</div>
          <div class="branch-name" id="tb-branch">Reservas</div>
        </div>
      </div>
      <div class="topbar-right">
        <!-- Date navigator -->
        <div class="rv-date-nav">
          <button class="rv-date-btn" id="rv-prev" onclick="changeDate(-1)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span class="rv-date-label" id="rv-date-label">Hoy</span>
          <button class="rv-date-btn" id="rv-next" onclick="changeDate(1)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
        <button class="btn-primary" onclick="openNewModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nueva reserva
        </button>
      </div>
    </header>

    <div id="content">

      <!-- Status bar -->
      <div class="rv-status-row" id="rv-status-row">
        <div class="rv-status-chip rv-status-chip--pendiente">
          <span id="cnt-pendiente">0</span> Pendientes
        </div>
        <div class="rv-status-chip rv-status-chip--confirmada">
          <span id="cnt-confirmada">0</span> Confirmadas
        </div>
        <div class="rv-status-chip rv-status-chip--llego">
          <span id="cnt-llego">0</span> Llegaron
        </div>
        <div class="rv-status-chip rv-status-chip--cancelada">
          <span id="cnt-cancelada">0</span> Canceladas
        </div>
        <div class="rv-status-chip rv-status-chip--noshow">
          <span id="cnt-noshow">0</span> No show
        </div>
      </div>

      <!-- Reservation list -->
      <div id="rv-list"></div>

    </div>
  </main>
</div>

<!-- ══════════ MODAL: Nueva / Editar reserva ══════════ -->
<div class="rv-overlay" id="rv-overlay" style="display:none" onclick="closeModal(event)">
  <div class="rv-modal" id="rv-modal">
    <div class="rv-modal-head">
      <div class="rv-modal-title" id="modal-title">Nueva reserva</div>
      <button class="rv-modal-close" onclick="closeModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="rv-modal-body">
      <input type="hidden" id="edit-id">
      <div class="rv-form-row">
        <div class="rv-form-group">
          <label class="rv-label">Nombre del cliente *</label>
          <input class="rv-input" id="f-name" placeholder="Ej: Familia Martínez" required>
        </div>
        <div class="rv-form-group">
          <label class="rv-label">Teléfono</label>
          <input class="rv-input" id="f-phone" placeholder="Ej: 3001234567" type="tel">
        </div>
      </div>
      <div class="rv-form-row">
        <div class="rv-form-group">
          <label class="rv-label">Fecha *</label>
          <input class="rv-input" id="f-date" type="date" required>
        </div>
        <div class="rv-form-group">
          <label class="rv-label">Hora *</label>
          <input class="rv-input" id="f-time" type="time" required>
        </div>
        <div class="rv-form-group">
          <label class="rv-label">Personas *</label>
          <input class="rv-input" id="f-guests" type="number" min="1" max="100" value="2" required>
        </div>
      </div>
      <div class="rv-form-group">
        <label class="rv-label">Mesa (opcional)</label>
        <select class="rv-input" id="f-table">
          <option value="">Sin asignar</option>
        </select>
      </div>
      <div class="rv-form-group">
        <label class="rv-label">Notas</label>
        <textarea class="rv-input rv-textarea" id="f-notes" placeholder="Ocasión especial, alergias, preferencias…" rows="3"></textarea>
      </div>
    </div>
    <div class="rv-modal-foot">
      <button class="rv-btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="rv-btn-save" onclick="saveReservation()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="btn-save-lbl">Guardar reserva</span>
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="pos-core.js?v=21"></script>
<script src="pos-print.js?v=13"></script>
<script src="pos-print-listener.js?v=1"></script>
<script src="reservas.js?v=1"></script>
</body>
</html>
