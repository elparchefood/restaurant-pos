<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Clientes — Cobra POS</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/brand/favicon-192.png">
<link rel="apple-touch-icon" href="assets/brand/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pos-core.css?v=1789840000">
<link rel="stylesheet" href="clientes.css?v=1791460000">
</head>
<body>
<div id="app">

  <!-- El menu del sistema. Vive en pos-nav.js: al entrar a Clientes no
       desaparece, solo cambia lo de la derecha. -->
  <aside id="sidebar"></aside>

  <main id="main">
  <div class="cl-root">

  <header class="cl-top">
    <div>
      <div class="cl-kicker" id="cl-negocio">Quién te compra y cada cuánto vuelve</div>
      <h1 class="cl-title">Clientes</h1>
    </div>
    <div class="cl-top-right">
      <!-- SOLO PARA EL ADMINISTRADOR DE LA PLATAFORMA. Nace oculto a
           proposito: visible de entrada, cada restaurante alcanzaria a
           verlo antes de que el JavaScript lo esconda. -->
      <a class="cl-back cl-pw" href="pagina-web.html?tab=clientes"
         id="cl-nav-pw" style="display:none">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        Clientes de la app
      </a>
    </div>
  </header>

  <main class="cl-main">

    <!-- Las tres cifras que resumen la relación con la gente. -->
    <div class="cl-franja" id="cl-franja"></div>

    <!-- Cuántos vuelven: la única pregunta que de verdad mueve el negocio. -->
    <div class="cl-rep" id="cl-rep"></div>

    <!-- Lista a la izquierda, la persona a la derecha. Un solo camino. -->
    <div class="cl-cuerpo">
      <div class="cl-lista">
        <div class="cl-li-top">
          <input class="cl-buscar" id="cl-buscar" type="search" placeholder="Busca por nombre o teléfono…" autocomplete="off">
          <div class="cl-chips" id="cl-chips">
            <button class="cl-chip on" data-f="todos">Todos</button>
            <button class="cl-chip" data-f="gastan">Los que más gastan</button>
            <button class="cl-chip" data-f="repiten">Repiten</button>
            <button class="cl-chip" data-f="una">Vinieron 1 vez</button>
          </div>
        </div>
        <div class="cl-li-scroll" id="cl-filas"></div>
      </div>
      <div class="cl-ficha" id="cl-ficha"></div>
    </div>

  </main>
  </main>
</div>

<script src="vendor/supabase-2.js?v=1789520000"></script>
<script src="pos-core.js?v=1792130000"></script>
<script src="pos-cache.js?v=1790510000"></script>
<script src="pos-perms.js?v=1792070000"></script>
<script src="pos-plan.js?v=1792461000"></script>
<script>if(window.posRequirePin) posRequirePin(['ventas.ver']);</script>
<script src="pos-brand.js?v=1790530000"></script>
<script src="pos-nav.js?v=1792360000"></script>
<script src="pos-solo-app.js?v=1792150000"></script>
<script src="pos-nfc.js?v=1791470000"></script>
<script src="clientes.js?v=1791810000"></script>
</body>
</html>
