<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cocina — Cobra POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap" rel="stylesheet">
<!-- Con version, como el resto del sistema: sin ella el ejecutable guarda
     la copia vieja y ningun arreglo le llega. -->
<link rel="stylesheet" href="cocina.css?v=20260826f">
</head>
<body>

<div class="k-app" id="app">

  <!-- Sin conexión: se muestra solo cuando hace falta -->
  <div class="k-caida" id="caida" hidden>
    <b>Sin conexión</b>
    <span>Lo que ves puede estar viejo · reintentando…</span>
  </div>

  <div class="k-top">
    <div class="k-marca" id="marca"></div>
    <div class="k-sede" id="sede">Cocina</div>
    <div class="k-cuenta">
      <div class="k-pastilla"><b id="cuenta">0</b> en cocina</div>
      <div class="k-vivo" id="vivo"><i class="k-punto"></i> En vivo</div>
      <div class="k-reloj" id="reloj">—</div>
    </div>
  </div>

  <div class="k-zonas">
    <section class="zona">
      <div class="zona-cab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 10h18M5 10V6h14v4M7 10v8M17 10v8"/></svg>
        <h2>Mesas</h2><b id="n-salon">0</b>
      </div>
      <div class="zona-lista" id="z-salon"></div>
    </section>

    <section class="zona">
      <div class="zona-cab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 8h12l-1 12H7L6 8zM9 8V5a3 3 0 0 1 6 0v3"/></svg>
        <h2>Para llevar</h2><b id="n-rapido">0</b>
      </div>
      <div class="zona-lista" id="z-rapido"></div>
    </section>

    <section class="zona">
      <div class="zona-cab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/><path d="M9 18h6M3 6h3l2 9M17 15l3-7H8"/></svg>
        <h2>Domicilios</h2><b id="n-domicilio">0</b>
      </div>
      <div class="zona-lista" id="z-domicilio"></div>
    </section>
  </div>

  <div class="k-pie">
    <span class="lg"><i style="background:#F97316"></i> En preparación</span>
    <span class="lg" id="lg-pago"><i style="background:#EF4444"></i> Pendiente de pago</span>
    <span class="lg"><i style="background:#8B5CF6"></i> Listo</span>
    <span class="lg" style="color:#DC2626"><i style="background:#fff;box-shadow:inset 0 0 0 2px #DC2626"></i> Marco rojo = va tarde</span>
    <button class="k-salir" id="salir">Salir</button>
  </div>

</div>

<div class="k-cargando" id="cargando">
  <div class="k-spin"></div>
  <p>Abriendo la cocina…</p>
</div>

<!-- La copia local, como TODAS las pantallas. El ejecutable no deja salir a
     un CDN externo: pedirlo afuera deja la pantalla girando para siempre. -->
<script src="vendor/supabase-2.js?v=1789520000"></script>
<script src="cocina.js?v=20260826f"></script>
</body>
</html>
