<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tomar pedido — Cobra POS</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/brand/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/brand/favicon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pos-core.css?v=1789840000">
  <link rel="stylesheet" href="tomar-pedido.css?v=1786752000">
</head>
<body>
<div class="tp-root">

  <!-- Backdrop sidebar (tablet) -->
  <div class="tp-side-backdrop" id="tp-side-backdrop"></div>

  <!-- ════════ SIDEBAR ACCIONES ════════ -->
  <aside class="tp-side">
    <!-- Asa deslizable (solo tablet): arrastra o toca para abrir/cerrar -->
    <button class="tp-side-grip" id="tp-side-toggle" title="Desliza o toca para abrir el menú" aria-label="Abrir menú">
      <span class="tp-grip-bar"></span>
      <span class="tp-grip-hint">
        <svg class="tp-grip-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
        <span class="tp-grip-txt">desliza</span>
      </span>
    </button>
    <div class="tp-brand">
      <div class="tp-brand-logo">L</div>
      <div>
        <div class="tp-brand-name">Cobra POS</div>
        <div class="tp-brand-sub" id="tp-branch-name">Cargando…</div>
      </div>
    </div>

    <div class="tp-side-section-wrap">
      <div class="tp-side-section">Mesa</div>
    </div>
    <nav class="tp-nav">
      <button class="lm-nav" data-action="back">
        <span class="tp-nav-l">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          <span>Regresar al salón</span>
        </span>
      </button>
      <div class="tp-nav-divider"></div>
      <button class="lm-nav" data-action="edit">
        <span class="tp-nav-l">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span>Editar mesa</span>
        </span>
      </button>
      <div class="tp-nav-divider"></div>
      <button class="lm-nav" data-action="merge">
        <span class="tp-nav-l">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          <span>Unir mesas</span>
        </span>
      </button>
      <button class="lm-nav" data-action="move" id="btn-move" disabled>
        <span class="tp-nav-l">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/></svg>
          <span>Mover pedidos</span>
        </span>
      </button>
    </nav>

    <div class="tp-side-foot">
      <div class="tp-cartmini">
        <div class="tp-cartmini-icon is-empty" id="cartmini-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        </div>
        <div>
          <div class="tp-cartmini-title" id="cartmini-title">0 ítems en cuenta</div>
          <div class="tp-cartmini-sub" id="cartmini-sub">Sin productos aún</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ════════ MAIN ════════ -->
  <div class="tp-main">

    <!-- Topbar oculto: en tablet robaba altura al resumen del pedido.
         Los nodos siguen presentes (ocultos) porque el JS los actualiza. -->
    <header class="tp-topbar" style="display:none">
      <span id="tp-crumb-mesa"></span><span id="tp-open-pill-text"></span>
      <strong id="tp-waiter-name"></strong>
      <span id="tp-user-avatar"></span><span id="tp-user-name"></span><span id="tp-user-role"></span>
    </header>

    <!-- Body: comanda | browser -->
    <div class="tp-body">

      <!-- ════ COMANDA ════ -->
      <section class="tp-comanda">
        <!-- Cabecera mesa -->
        <div class="tp-comanda-head">
          <div class="tp-comanda-headtop">
            <div class="tp-mesa-id">
              <!-- El numero de mesa va DENTRO del cuadro: alinea todo en una linea -->
              <div class="tp-mesa-glyph"><span class="tp-mesa-num" id="tp-mesa-title">—</span></div>
              <div class="tp-open-pill is-empty" id="tp-open-pill">
                <span class="dot"></span>
                <span id="tp-open-pill-label">Mesa abierta</span>
                <span class="tp-open-time">&middot; <span id="tp-hora-apertura">—</span></span>
              </div>
            </div>
            <div class="tp-pax">
              <div class="tp-stepper">
                <button class="lm-step" data-personas="dec">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
                <span class="tp-stepper-num" id="personas-num">2</span>
                <button class="lm-step" data-personas="inc">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
              </div>
              <span class="tp-pax-lbl">pax</span>
            </div>
          </div>
        </div>

        <!-- Fila cliente -->
        <div class="tp-cliente" id="cliente-row">
          <div class="tp-cliente-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <span class="tp-cliente-placeholder" id="cliente-placeholder">Selecciona un cliente</span>
          <input class="tp-cliente-input" id="cliente-input" placeholder="Nombre del cliente…" style="display:none">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="cliente-chevron"><polyline points="9 18 15 12 9 6"/></svg>
        </div>

        <!-- Estado vacío -->
        <div class="tp-empty" id="comanda-empty">
          <div class="tp-empty-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          </div>
          <div class="tp-empty-title">Comanda vacía</div>
          <div class="tp-empty-text">Agrega productos desde el catálogo para comenzar el pedido.</div>
        </div>

        <!-- Lista de ítems -->
        <div class="tp-cart-scroll" id="cart-scroll" hidden>
          <div class="tp-comanda-listhead">
            <span class="tp-section-micro" id="cart-count-label">Comanda · 0 ítems</span>
            <button class="lm-link" data-action="vaciar">Vaciar</button>
          </div>
          <div id="cart-lines"></div>
        </div>

        <!-- Pie totales -->
        <div class="tp-comanda-foot" id="comanda-foot" hidden>
          <div class="tp-totals">
            <!-- Subtotal solo cuando difiere del total (descuento). El interruptor
                 de Servicio se movio al cobro: en la tablet no debe ir. -->
            <div class="tp-total-row" id="row-subtotal" hidden>
              <span>Subtotal</span>
              <span id="t-subtotal">$0</span>
            </div>
            <div class="tp-total-row" id="row-servicio" hidden>
              <span>Servicio</span>
              <span id="t-servicio">$0</span>
            </div>
            <div class="tp-total-grand">
              <div class="tp-total-row" style="font-size:inherit;font-weight:inherit;color:inherit">
                <span>Total</span>
                <span id="t-total">$0</span>
              </div>
            </div>
          </div>
          <div class="tp-comanda-actions">
            <button class="lm-btn-ghost" data-action="guardar" style="flex:1">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              Guardar
            </button>
            <button class="lm-btn-primary" data-action="enviar-cocina" style="flex:2">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
              Enviar a cocina
            </button>
          </div>
        </div>
      </section>

      <!-- ════ BROWSER ════ -->
      <section class="tp-browser">
        <!-- Pestañas -->
        <div class="tp-browser-tabs">
          <button class="lm-bigtab is-active" data-tab="categoria">Categorías</button>
          <button class="lm-bigtab" data-tab="combos">Combos</button>
          <button class="lm-bigtab" data-tab="puntos">Puntos</button>
          <button class="lm-bigtab" data-tab="favoritos">Favoritos</button>
        </div>

        <div class="tp-browser-body">

          <!-- PANE: Categorías -->
          <div class="tp-pane on" data-pane="categoria">
            <!-- Sub: grid de categorías -->
            <div class="tp-sub on" data-sub="grid">
              <div class="tp-catgrid" id="cat-grid">
                <div style="color:#94A3B8;font-size:13px;grid-column:1/-1;padding:24px 0;text-align:center">Cargando categorías…</div>
              </div>
            </div>
            <!-- Sub: productos de categoría -->
            <div class="tp-sub" data-sub="products">
              <div class="tp-gridhead">
                <button class="lm-back" data-sub-back>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
                  Categorías
                </button>
                <div class="tp-gridhead-info">
                  <span class="tp-catdot" id="prod-cat-dot"></span>
                  <span class="tp-gridhead-title" id="prod-cat-name"></span>
                  <span class="tp-countpill" id="prod-cat-count"></span>
                </div>
              </div>
              <div class="tp-prodgrid" id="prod-grid"></div>
            </div>
          </div>

          <!-- PANE: Menú completo -->
          <div class="tp-pane" data-pane="combos">
            <div class="tp-prodgrid" id="tp-combos-grid"></div>
          </div>

          <!-- PANE: Búsqueda -->
          <div class="tp-pane" data-pane="puntos">
            <div class="tp-prodgrid" id="tp-puntos-grid"></div>
          </div>

          <!-- PANE: Favoritos -->
          <div class="tp-pane" data-pane="favoritos">
            <div class="tp-gridhead" style="padding-bottom:14px;flex-shrink:0">
              <span class="tp-catdot" style="background:#F59E0B"></span>
              <span class="tp-gridhead-title">Favoritos</span>
              <span class="tp-countpill" id="fav-count">0</span>
            </div>
            <div class="tp-prodgrid" id="fav-grid"></div>
          </div>

        </div>
      </section>

    </div><!-- /.tp-body -->
  </div><!-- /.tp-main -->
</div><!-- /.tp-root -->


<!-- Modal: Flujo de producto (pm-* design) -->
<div class="pm-overlay" id="tp-modal-producto" style="display:none" onclick="tpCheckOverlayClose(event)">
  <div class="pm-modal" id="pm-modal-inner">
    <!-- JS fills: pm-head + pm-steps + pm-body + pm-foot -->
  </div>
</div>

<script src="vendor/supabase-2.js?v=1789520000"></script>
<script src="pos-sync.js?v=3"></script>
<script src="pos-core.js?v=1790280000"></script>
<script src="pos-cache.js?v=1790500000"></script>
  <script src="pos-plan.js?v=1790500000"></script>
<script src="pos-notify.js?v=1790370000"></script>
<script src="pos-perms.js?v=1789530000"></script>
<script src="pos-brand.js?v=1790290000"></script>
<script src="pos-impuestos.js?v=1"></script>
<script src="pos-print.js?v=1790300000"></script>
<script src="pos-print-listener.js?v=4"></script>
<script src="pos-stock.js?v=1786752000"></script>
<script src="pos-clientes.js?v=1788280000"></script>
<script src="pos-cliente-picker.js?v=1788280000"></script>
<script src="pos-notas.js?v=1789660000"></script>
<script src="pos-combos.js?v=1789770000"></script>
  <script src="pos-puntos.js?v=1789770000"></script>
  <script src="pos-tabs.js?v=1789780000"></script>
  <script src="tomar-pedido.js?v=1789810000"></script>
</body>
</html>
