<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventas · Por salón — Cobra POS</title>
  <link rel="preconnect" href="https://tblujfduscslxjmrjbdr.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pos-core.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; overscroll-behavior: none; }
    body { background: #FAFAFB; }
    .vs-dots-menu { position: fixed; background: #fff; border: 1px solid #E2E8F0; border-radius: 10px; box-shadow: 0 8px 24px rgba(15,23,42,.14); z-index: 9999; min-width: 168px; padding: 4px; }
    .vs-dots-menu-item { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: none; background: none; width: 100%; text-align: left; font-size: 13px; font-weight: 500; color: #334155; border-radius: 7px; cursor: pointer; }
    .vs-dots-menu-item:hover { background: #F1F5F9; }
    .vs-dots-menu-item--danger { color: #DC2626; }
    .vs-dots-menu-item--danger:hover { background: #FEF2F2; }
    #pos-loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #FAFAFB; gap: 14px; z-index: 9999;
    }
    .loader-spinner {
      width: 32px; height: 32px;
      border: 3px solid #ECEEF2;
      border-top-color: #5B6BFF;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #pos-loader p {
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 13px; color: #94A3B8; font-weight: 500;
    }
    #pos-app { width: 100%; height: 100vh; }
  </style>
</head>
<body>

  <div id="pos-loader">
    <div class="loader-spinner"></div>
    <p>Cargando ventas…</p>
  </div>

  <div id="pos-app"></div>

  <!-- 1. Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 1b. Sync offline -->
  <script src="pos-sync.js?v=3"></script>
  <!-- 2. Core del sistema -->
  <script src="pos-core.js?v=25"></script>
  <!-- 3. Bus de eventos -->
  <script src="pos-events.js"></script>
  <!-- 4. Impresión (necesario para auto-print desde realtime en escritorio) -->
  <script src="pos-print.js?v=13"></script>
<script src="pos-print-listener.js?v=1"></script>
  <!-- 5. Realtime -->
  <script src="pos-realtime.js?v=2"></script>
  <!-- 5. Guard de caja -->
  <script src="pos-caja-guard.js?v=1"></script>
  <!-- 6. Módulo ventas salón -->
  <script src="modules/ventas-salon.js?v=1783614500"></script>

  <script>
    // Muestra error en el loader y agrega botón de reintento
    function _ventasShowError(msg) {
      clearTimeout(window._ventasBootTimeout);
      var loader = document.getElementById('pos-loader');
      if (!loader) return;
      loader.innerHTML =
        '<div style="text-align:center;font-family:DM Sans,system-ui,sans-serif;padding:24px">' +
          '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2" style="margin-bottom:12px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
          '<p style="color:#0F172A;font-size:14px;font-weight:600;margin:0 0 6px">No se pudo cargar Ventas</p>' +
          '<p style="color:#94A3B8;font-size:12px;margin:0 0 18px;max-width:260px">' + (msg || 'Error desconocido') + '</p>' +
          '<button onclick="window.location.reload()" style="background:#5B6BFF;color:#fff;border:none;border-radius:10px;padding:9px 22px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">Reintentar</button>' +
        '</div>';
    }

    // Si después de 15 s el loader sigue visible, mostrar error de timeout
    window._ventasBootTimeout = setTimeout(function () {
      var loader = document.getElementById('pos-loader');
      if (loader && loader.style.display !== 'none') {
        _ventasShowError('Tiempo de espera agotado. Verifica tu conexión a internet.');
      }
    }, 15000);

    // Cuando el core esté listo, inicializar el módulo de ventas
    window._pos.on('core:ready', function () {
      const app = document.getElementById('pos-app');
      const loader = document.getElementById('pos-loader');

      if (window._pos.modules && window._pos.modules.ventasSalon) {
        window._pos.modules.ventasSalon.init(app).then(function () {
          clearTimeout(window._ventasBootTimeout);
          if (loader) loader.style.display = 'none';
          app.style.display = 'block';
        }).catch(function (err) {
          console.error('[ventas.html] init() falló:', err);
          _ventasShowError(err && err.message ? err.message : String(err));
        });
      } else {
        console.error('[ventas.html] Módulo ventasSalon no encontrado');
        _ventasShowError('Módulo de ventas no disponible. Recarga la página.');
      }
    });

    // Escuchar navegación desde dentro del módulo
    window._pos.on('table:open', async function (data) {
      if (data && data.tableId) {
        if (!(await window.cajaGuard(window._pos.state.branchId))) return;
        const guestParam = data.guests ? '&guests=' + data.guests : '';
        window.location.href = 'tomar-pedido.html?table=' + data.tableId + guestParam;
      }
    });

    window._pos.on('nav:back', function () {
      window.location.href = 'dashboard.html';
    });
  </script>

</body>
</html>
