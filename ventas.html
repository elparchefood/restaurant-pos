<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventas · Por salón — Cobra POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pos-core.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #FAFAFB; }
    #pos-loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #FAFAFB; gap: 14px; z-index: 9999;
    }
    .loader-spinner {
      width: 32px; height: 32px;
      border: 3px solid #ECEEF2;
      border-top-color: #5B6BFF;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #pos-loader p {
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 13px; color: #94A3B8; font-weight: 500;
    }
    #pos-app { width: 100%; height: 100vh; }
  </style>
</head>
<body>

  <div id="pos-loader">
    <div class="loader-spinner"></div>
    <p>Cargando ventas…</p>
  </div>

  <div id="pos-app"></div>

  <!-- 1. Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 1b. Sync offline -->
  <script src="pos-sync.js"></script>
  <!-- 2. Core del sistema -->
  <script src="pos-core.js"></script>
  <!-- 3. Bus de eventos -->
  <script src="pos-events.js"></script>
  <!-- 4. Realtime -->
  <script src="pos-realtime.js"></script>
  <!-- 5. Módulo ventas salón -->
  <script src="modules/ventas-salon.js?v=1783545664"></script>

  <script>
    // Cuando el core esté listo, inicializar el módulo de ventas
    window._pos.on('core:ready', function () {
      const app = document.getElementById('pos-app');
      const loader = document.getElementById('pos-loader');

      if (window._pos.modules && window._pos.modules.ventasSalon) {
        window._pos.modules.ventasSalon.init(app).then(function () {
          if (loader) loader.style.display = 'none';
          app.style.display = 'block';
        });
      } else {
        console.error('[ventas.html] Módulo ventasSalon no encontrado');
      }
    });

    // Escuchar navegación desde dentro del módulo
    window._pos.on('table:open', function (data) {
      if (data && data.tableId) {
        window.location.href = 'tomar-pedido.html?table=' + data.tableId;
      }
    });

    window._pos.on('nav:back', function () {
      window.location.href = 'dashboard.html';
    });
  </script>

</body>
</html>
