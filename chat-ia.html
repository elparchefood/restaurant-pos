<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat IA — Cobra POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="chat-ia.css?v=8">
</head>
<body>

<div class="ci-root">

  <!-- SIDEBAR -->
  <aside class="ci-side">
    <div class="ci-brand">
      <div class="ci-brand-mark">L</div>
      <div>
        <div class="ci-brand-name">Cobra POS</div>
        <div class="ci-brand-sub" id="branchLabel">Cargando…</div>
      </div>
    </div>

    <nav class="ci-nav">
      <a href="ventas.html" class="ci-nav-btn">
        <span class="ci-nav-l">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          <span>Regresar</span>
        </span>
      </a>
      <div class="ci-nav-sep"></div>

      <button class="ci-nav-btn active" data-view="all">
        <span class="ci-nav-l">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Bandeja</span>
        </span>
        <span class="ci-nav-badge" id="badge-all">0</span>
      </button>
      <button class="ci-nav-btn" data-view="pending">
        <span class="ci-nav-l">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span>Sin responder</span>
        </span>
        <span class="ci-nav-badge" id="badge-pending">0</span>
      </button>
      <button class="ci-nav-btn" data-view="mine">
        <span class="ci-nav-l">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Míos</span>
        </span>
      </button>
      <button class="ci-nav-btn" data-view="resolved">
        <span class="ci-nav-l">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          <span>Resueltos</span>
        </span>
      </button>
      <button class="ci-nav-btn" data-view="archived">
        <span class="ci-nav-l">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
          <span>Archivados</span>
        </span>
      </button>

      <div class="ci-nav-cap">Canales conectados</div>
      <div class="ci-channels" id="channelsList"></div>
    </nav>

    <div class="ci-side-foot">
      <div class="ci-user">
        <div class="ci-user-av" id="userAv">SA</div>
        <div>
          <div class="ci-user-name" id="userName">Cargando…</div>
          <div class="ci-user-role" id="userRole">—</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- LISTA DE CONVERSACIONES -->
  <section class="ci-list">
    <div class="ci-list-head">
      <div class="ci-list-titlerow">
        <div class="ci-list-title">
          Chat IA
          <span class="ci-list-sub" id="totalUnread">0 sin leer</span>
        </div>
        <div class="ci-head-btns">
          <button class="ci-icon-btn active" id="filterToggle" title="Mostrar/ocultar filtros">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          </button>
          <button class="ci-icon-btn primary" title="Nueva conversación" id="newConvBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>
      <div class="ci-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" placeholder="Buscar conversación…">
      </div>
    </div>

    <div class="ci-filter-wrap" id="filterWrap">
      <div class="ci-seg" id="channelFilters"></div>
    </div>

    <div class="ci-conv-list" id="convList"></div>
  </section>

  <!-- PANEL DE CHAT -->
  <main class="ci-chat">
    <div class="ci-empty" id="chatEmpty">
      <div class="ci-empty-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#C7D2FE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div class="ci-empty-title">Selecciona una conversación</div>
      <div class="ci-empty-sub">Los mensajes de WhatsApp, Instagram, Facebook y TikTok aparecen aquí</div>
    </div>

    <header class="ci-chat-head" id="chatHead" style="display:none">
      <div class="ci-chat-id">
        <div class="ci-chat-av" id="chatAv"></div>
        <div>
          <div class="ci-chat-name" id="chatName"></div>
          <div class="ci-chat-meta" id="chatMeta"></div>
        </div>
      </div>
      <div class="ci-chat-actions">
        <button class="ci-icon-btn" title="Buscar en el chat">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="ci-icon-btn" title="Datos del cliente">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        </button>
        <button class="ci-btn-primary" id="createOrderBtn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          Crear pedido
        </button>
        <button class="ci-icon-btn" title="Más opciones">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        </button>
      </div>
    </header>

    <div class="ci-thread" id="thread" style="display:none"></div>

    <!-- Global message menu popup (click-triggered, stays open) -->
    <div class="ci-msg-popup" id="msgMenuPopup" style="display:none">
      <div class="ci-popup-emojis" id="popupEmojis"></div>
      <div class="ci-popup-divider"></div>
      <div class="ci-popup-items" id="popupItems"></div>
    </div>

    <!-- Reply preview (shown above composer when replying) -->
    <div class="ci-reply-preview" id="replyPreview" style="display:none">
      <div class="ci-reply-preview-bar"></div>
      <div class="ci-reply-preview-body">
        <span class="ci-reply-preview-who" id="replyWho"></span>
        <span class="ci-reply-preview-text" id="replyText"></span>
      </div>
      <button class="ci-reply-preview-close" id="replyCancel">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Sticker panel (shown above composer) -->
    <div class="ci-sticker-panel" id="stickerPanel" style="display:none">
      <div class="ci-sticker-panel-head">
        <span>Stickers guardados</span>
        <button id="stickerPanelClose">✕</button>
      </div>
      <div class="ci-sticker-grid" id="stickerGrid">
        <div style="color:var(--text-4);font-size:13px;padding:16px;text-align:center">Aquí aparecerán los stickers que recibas</div>
      </div>
    </div>

    <div class="ci-composer" id="composer" style="display:none">
      <input type="file" id="attachInput" accept="image/*,video/*,audio/*,.pdf,.doc,.docx" style="display:none">
      <button class="ci-comp-attach" id="attachBtn" title="Adjuntar archivo">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <div class="ci-comp-field">
        <input id="msgInput" placeholder="Escribe una respuesta…">
        <button class="ci-comp-emoji" id="stickerBtn" title="Stickers">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 0 1 10 10c0 5.52-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2z"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M15 9.5c0 .83-.67 1.5-1.5 1.5S12 10.33 12 9.5 12.67 8 13.5 8 15 8.67 15 9.5z" fill="currentColor" stroke="none"/><path d="M9 9.5c0 .83-.67 1.5-1.5 1.5S6 10.33 6 9.5 6.67 8 7.5 8 9 8.67 9 9.5z" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
      <button class="ci-send-btn" id="sendBtn" title="Enviar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </main>

</div>

<script src="chat-ia.js?v=5"></script>
</body>
</html>
