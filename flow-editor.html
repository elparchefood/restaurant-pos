<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor de flujo IA — Cobra POS</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/brand/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/brand/favicon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F4F5F8;--surface:#fff;--border:#E2E5EC;--border-s:#C8CDD8;
  --text-1:#0F172A;--text-2:#475569;--text-3:#94A3B8;
  --accent:#5B6BFF;--accent-h:#4F5BE3;--accent-bg:#EEF2FF;
  --violet:#7C3AED;--violet-bg:#F3EEFF;
  --teal:#0D9488;--teal-bg:#E6FAF8;
  --amber:#B45309;--amber-bg:#FEF3C7;
  --red:#DC2626;--red-bg:#FEE2E2;
  --green:#16A34A;--green-bg:#DCFCE7;
  --gray2:#64748B;--gray-bg:#F1F5F9;
  --font:'DM Sans',-apple-system,sans-serif;
  --r:10px;--r-sm:7px;
}
body{font-family:var(--font);background:var(--bg);height:100vh;overflow:hidden;color:var(--text-1);display:flex;flex-direction:column}

/* TOP BAR */
.topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:100}
.topbar-back{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);cursor:pointer;padding:6px 10px;border-radius:var(--r-sm);transition:background .15s}
.topbar-back:hover{background:var(--gray-bg)}
.topbar-back svg{width:14px;height:14px}
.topbar-sep{width:1px;height:20px;background:var(--border)}
.topbar-title{font-size:14px;font-weight:700;color:var(--text-1)}
.topbar-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--teal-bg);color:var(--teal)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.save-status{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:4px}
.save-status svg{width:12px;height:12px;color:var(--green)}
.zoom-controls{display:flex;align-items:center;gap:2px}
.zoom-btn{width:28px;height:28px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text-2);transition:background .15s}
.zoom-btn:hover{background:var(--gray-bg)}
.zoom-val{font-size:12px;color:var(--text-2);padding:0 6px;min-width:38px;text-align:center}
.btn-save{height:32px;padding:0 14px;border-radius:var(--r-sm);background:var(--accent);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:background .15s}
.btn-save:hover{background:var(--accent-h)}

/* MAIN LAYOUT */
.editor-body{flex:1;display:flex;overflow:hidden}

/* PALETTE */
.palette{width:208px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.palette-header{padding:14px 14px 10px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--text-3);text-transform:uppercase}
.palette-list{flex:1;overflow-y:auto;padding:0 8px 12px}
.palette-node{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);cursor:grab;margin-bottom:4px;border:1px solid transparent;transition:background .12s,border-color .12s;user-select:none}
.palette-node:hover{background:var(--gray-bg);border-color:var(--border)}
.palette-node:active{cursor:grabbing;opacity:.8}
/* Los grupos de la paleta: separan lo que se le PREGUNTA al cliente de como se
   comporta el flujo. Antes era una lista plana de 7 cajas genericas. */
.pal-grupo{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin:14px 0 6px 2px}
.pal-grupo:first-child{margin-top:2px}
/* Cada mision con su color, para distinguirlas de un vistazo en el lienzo. */
.df-node.mis-amber  .df-node-icon{background:var(--amber-bg);color:var(--amber)}
.df-node.mis-violet .df-node-icon{background:var(--violet-bg);color:var(--violet)}
.df-node.mis-teal   .df-node-icon{background:var(--teal-bg);color:var(--teal)}
.df-node.mis-green  .df-node-icon{background:var(--green-bg);color:var(--green)}
.df-node.mis-red    .df-node-icon{background:var(--red-bg);color:var(--red)}
.df-node.mis-accent .df-node-icon{background:var(--accent-bg);color:var(--accent)}
.df-node.mis-gray   .df-node-icon{background:var(--gray-bg);color:var(--gray2)}
.pn-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pn-icon svg{width:15px;height:15px}
.pn-info{flex:1;min-width:0}
.pn-name{font-size:13px;font-weight:600;color:var(--text-1)}
.pn-desc{font-size:11px;color:var(--text-3);margin-top:1px}
.palette-sep{margin:8px 10px;border:none;border-top:1px solid var(--border)}

/* CANVAS AREA */
.canvas-wrap{flex:1;position:relative;overflow:hidden}
.canvas-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.7);color:#fff;font-size:12px;padding:6px 14px;border-radius:20px;pointer-events:none;z-index:10;white-space:nowrap}

/* CONFIG PANEL */
.config-panel{width:0;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .22s cubic-bezier(.4,0,.2,1)}
.config-panel.open{width:300px}
.cp-header{padding:16px 16px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.cp-header-title{font-size:13px;font-weight:700;color:var(--text-1)}
.cp-close{width:26px;height:26px;border-radius:var(--r-sm);border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.cp-close:hover{background:var(--gray-bg)}
.cp-close svg{width:14px;height:14px}
.cp-body{flex:1;overflow-y:auto;padding:16px}
.cp-section{margin-bottom:20px}
.cp-label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}
.cp-input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:13px;font-family:var(--font);color:var(--text-1);outline:none;background:var(--surface);transition:border-color .15s}
.cp-input:focus{border-color:var(--accent)}
.cp-textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:13px;font-family:var(--font);color:var(--text-1);outline:none;resize:vertical;min-height:90px;line-height:1.5;background:var(--surface);transition:border-color .15s}
.cp-textarea:focus{border-color:var(--accent)}
.type-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.type-btn{padding:8px 6px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--surface);cursor:pointer;text-align:center;font-family:var(--font);transition:all .15s}
.type-btn .tb-icon{font-size:18px;margin-bottom:3px}
.type-btn .tb-label{font-size:11px;font-weight:600;color:var(--text-2);display:block}
.type-btn.active-fija{border-color:var(--accent);background:var(--accent-bg)}
.type-btn.active-fija .tb-label{color:var(--accent)}
.type-btn.active-ia{border-color:var(--violet);background:var(--violet-bg)}
.type-btn.active-ia .tb-label{color:var(--violet)}
.vars-row{display:flex;flex-wrap:wrap;gap:5px}
.var-chip{padding:3px 8px;border-radius:20px;background:var(--gray-bg);border:1px solid var(--border);font-size:11px;font-weight:500;color:var(--text-2);cursor:pointer;font-family:'DM Sans Mono',monospace,sans-serif;transition:background .12s}
.var-chip:hover{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.cp-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:var(--r-sm);background:var(--gray-bg)}
.cp-toggle-label{font-size:13px;font-weight:500;color:var(--text-1)}
.toggle{position:relative;width:36px;height:20px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle-track{position:absolute;inset:0;border-radius:20px;background:var(--border-s);transition:background .2s}
.toggle input:checked ~ .toggle-track{background:var(--accent)}
.toggle-thumb{position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle input:checked ~ .toggle-thumb{transform:translateX(16px)}
.cp-footer{padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0}
.btn-delete{width:100%;padding:8px;border-radius:var(--r-sm);border:1px solid var(--red-bg);background:var(--red-bg);color:var(--red);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .15s}
.btn-delete:hover{background:var(--red);color:#fff}

/* DRAWFLOW OVERRIDES */
#drawflow{width:100%;height:100%;background-color:var(--bg);background-image:radial-gradient(var(--border-s) 1px, transparent 1px);background-size:24px 24px}
.drawflow .drawflow-node{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;min-width:180px;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.06);transition:border-color .15s,box-shadow .15s}
.drawflow .drawflow-node.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.drawflow .drawflow-node .inputs,.drawflow .drawflow-node .outputs{top:50%;transform:translateY(-50%)}
.drawflow .drawflow-node .input,.drawflow .drawflow-node .output{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--border-s);background:var(--surface);transition:border-color .15s}
.drawflow .drawflow-node .input:hover,.drawflow .drawflow-node .output:hover{border-color:var(--accent);background:var(--accent-bg)}
.drawflow .connection .main-path{stroke:#C8CDD8;stroke-width:2.5;fill:none}
.drawflow .connection .main-path:hover,.drawflow .connection.selected .main-path{stroke:var(--accent)}
.drawflow .drawflow-delete{background:var(--red);width:18px;height:18px;font-size:12px;border-radius:50%;top:-7px;right:-7px}

/* NODE CONTENT */
.df-node{padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer}
.df-node-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.df-node-icon svg{width:16px;height:16px}
.df-node-body{flex:1;min-width:0}
.df-node-name{font-size:13px;font-weight:700;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.df-node-type{font-size:11px;color:var(--text-3);margin-top:1px}
.df-node-dot{width:7px;height:7px;border-radius:50%;background:var(--border-s);flex-shrink:0}
.df-node-dot.on{background:var(--green)}

/* NODE TYPE COLORS */
.n-inicio .df-node-icon{background:var(--teal-bg)} .n-inicio .df-node-icon svg{color:var(--teal)}
.n-fija .df-node-icon{background:var(--accent-bg)} .n-fija .df-node-icon svg{color:var(--accent)}
.n-ia .df-node-icon{background:var(--violet-bg)} .n-ia .df-node-icon svg{color:var(--violet)}
.n-pregunta .df-node-icon{background:var(--amber-bg)} .n-pregunta .df-node-icon svg{color:var(--amber)}
.n-timer .df-node-icon{background:var(--gray-bg)} .n-timer .df-node-icon svg{color:var(--gray2)}
.n-resumen .df-node-icon{background:var(--green-bg)} .n-resumen .df-node-icon svg{color:var(--green)}
.drawflow .drawflow-node.n-inicio.selected{border-color:var(--teal)}
.drawflow .drawflow-node.n-ia.selected{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-bg)}
.drawflow .drawflow-node.n-pregunta.selected{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-bg)}
.drawflow .drawflow-node.n-resumen.selected{border-color:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
</style>

<div class="topbar">
  <a class="topbar-back" href="configuracion.html" style="text-decoration:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    Regresar
  </a>
  <div class="topbar-sep"></div>
  <div class="topbar-title">Editor de flujo IA</div>
  <div class="topbar-badge">WhatsApp</div>
  <div class="topbar-right">
    <div class="save-status" id="saveStatus">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      Guardado
    </div>
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="zoom(-1)">−</button>
      <span class="zoom-val" id="zoomVal">100%</span>
      <button class="zoom-btn" onclick="zoom(1)">+</button>
    </div>
    <button class="btn-save" onclick="saveFlow()">Guardar</button>
  </div>
</div>

<div class="editor-body">
  <!-- PALETTE -->
  <div class="palette">
    <div class="palette-header">Pasos</div>
    <div class="palette-list">
      <div id="paletaPasos"></div></div>
      </div>
    </div>
  </div>

  <!-- CANVAS -->
  <div class="canvas-wrap">
    <div id="drawflow"></div>
    <div class="canvas-hint">Arrastra pasos desde el panel izquierdo · Conecta los puntos para definir el flujo</div>
  </div>

  <!-- CONFIG PANEL -->
  <div class="config-panel" id="configPanel">
    <div class="cp-header">
      <div class="cp-header-title" id="cpTitle">Configurar paso</div>
      <button class="cp-close" onclick="closePanel()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="cp-body" id="cpBody"></div>
    <div class="cp-footer">
      <button class="btn-delete" id="btnDelete" onclick="deleteSelected()">Eliminar paso</button>
    </div>
  </div>
</div>

<script>

const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRibHVqZmR1c2NzbHhqbXJqYmRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMDU3NTcsImV4cCI6MjA5NjY4MTc1N30.0zudypPzlrOQ6dDa1Vp2XFFDL4Ea8dep1r3KMuEZGn0';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'cobra-pos-session' }
});
const RESUMEN_DEFAULT = "¡Listo! Tu pedido quedaría así:\n{{productos}}\n📍 {{direccion}}\n💳 {{pago}}\n{{nombre_linea}}💵 Pedido: {{precio_pedido}}\n🏍️ Domicilio: {{precio_domi}}\n💰 *Total: {{precio_total}}*\n\n{{confirmacion}}";
const NODE_ICONS = {
  inicio:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
  fija:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
  ia:       `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>`,
  pregunta: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  timer:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
  resumen:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/></svg>`,
  carta:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
};

/* ══════════════════════════════════════════════════════════════════════
   LA PALETA — una caja por MISION.

   Cada entrada dice: como se llama, que hace, de que tipo es por dentro
   (`type`), que dato captura (`campo`) y que papel juega (`rol`).

   Los grupos no son decoracion: separan lo que se le PREGUNTA al cliente de
   como se comporta el flujo. Mezclarlos en una sola lista es parte de por que
   costaba encontrar las cosas.
   ══════════════════════════════════════════════════════════════════════ */
const PALETA = [
  { grupo:'El flujo' },
  { k:'inicio',      nombre:'Inicio',     desc:'Por dónde empieza',                    type:'inicio', color:'accent' },
  { k:'saludo',      nombre:'Saludo',     desc:'El primer mensaje al cliente',         type:'ia',     rol:'saludo', color:'accent' },

  { grupo:'Qué va a pedir' },
  { k:'producto',    nombre:'Productos',      desc:'Qué quiere y cuántos',                     type:'pregunta', campo:'producto',     color:'amber' },
  { k:'tamano',      nombre:'Presentación',   desc:'Personal, familiar, litro…',               type:'pregunta', campo:'tamano',       color:'amber' },
  { k:'tipo',        nombre:'Variantes',      desc:'Mixta, pollo, mango…',                     type:'pregunta', campo:'tipo',         color:'amber' },

  { grupo:'Lo que se le suma' },
  { k:'adiciones',   nombre:'Adiciones',      desc:'Lo que el cliente le agrega',              type:'pregunta', campo:'adiciones',    color:'violet' },
  { k:'upsell',      nombre:'Upsell',         desc:'Lo que tú le sugieres, una vez',           type:'pregunta', campo:'upsell',       color:'violet' },
  { k:'preferencias',nombre:'Preferencias',   desc:'Sin cebolla, cubiertos, indicaciones',     type:'pregunta', campo:'preferencias', color:'violet' },

  { grupo:'Datos del cliente' },
  { k:'direccion',   nombre:'Dirección',      desc:'Barrio y dirección, para el domicilio',    type:'pregunta', campo:'direccion',    color:'teal' },
  { k:'nombre',      nombre:'Nombre',         desc:'A nombre de quién se recibe',              type:'pregunta', campo:'nombre',       color:'teal' },
  { k:'pago',        nombre:'Método de pago', desc:'Cómo paga, y el comprobante',              type:'pregunta', campo:'pago',         color:'teal' },

  { grupo:'Cierre' },
  { k:'resumen',     nombre:'Resumen',              desc:'Muestra el pedido y confirma',       type:'resumen', color:'green' },
  { k:'cierre',      nombre:'Cierre',               desc:'Mensaje final cuando paga en efectivo', type:'fija', rol:'cierre',      color:'green' },
  { k:'comprobante', nombre:'Esperar comprobante',  desc:'Cuando paga por transferencia',      type:'fija', rol:'comprobante', color:'green' },
  { k:'envio',       nombre:'Aviso de envío',       desc:'Avisar cuando el pedido sale',       type:'fija', rol:'envio',       color:'green' },

  { grupo:'Casos especiales' },
  { k:'carta',       nombre:'Carta',             desc:'Cuando pregunten qué hay',              type:'carta',    color:'red' },
  { k:'programado',  nombre:'Pedido programado', desc:'Para qué día y hora lo quiere',         type:'pregunta', campo:'programado', color:'red' },
  { k:'reserva',     nombre:'Reserva',           desc:'Día, hora, personas y zona',            type:'pregunta', campo:'reserva',    color:'red' },
  { k:'factura',     nombre:'Factura',           desc:'Cédula o NIT para facturación',         type:'pregunta', campo:'factura',    color:'red' },

  { grupo:'Piezas libres' },
  { k:'mensaje',     nombre:'Mensaje',      desc:'Una frase tuya, donde la pongas',            type:'fija',  color:'gray' },
  { k:'espera',      nombre:'Espera',       desc:'Pausa antes de seguir',                      type:'timer', color:'gray' },
];
const PAL_POR_K = Object.fromEntries(PALETA.filter(p=>p.k).map(p=>[p.k,p]));
/* Para pintar un nodo ya guardado: se busca por su campo o su rol. */
const PAL_POR_CAMPO = Object.fromEntries(PALETA.filter(p=>p.campo).map(p=>[p.campo,p]));
const PAL_POR_ROL   = Object.fromEntries(PALETA.filter(p=>p.rol).map(p=>[p.rol,p]));

function palDe(data) {
  if (!data) return null;
  if (data.campo && PAL_POR_CAMPO[data.campo]) return PAL_POR_CAMPO[data.campo];
  if (data.rol   && PAL_POR_ROL[data.rol])     return PAL_POR_ROL[data.rol];
  if (data.type === 'inicio')  return PAL_POR_K.inicio;
  if (data.type === 'resumen') return PAL_POR_K.resumen;
  if (data.type === 'carta')   return PAL_POR_K.carta;
  if (data.type === 'timer')   return PAL_POR_K.espera;
  return null;
}

function pintarPaleta() {
  const cont = document.getElementById('paletaPasos');
  if (!cont) return;
  cont.innerHTML = PALETA.map(p => {
    if (p.grupo) return '<div class="pal-grupo">' + p.grupo + '</div>';
    const ico = NODE_ICONS[p.type] || NODE_ICONS.fija;
    return '<div class="palette-node pal-' + p.color + '" draggable="true"'
      + ' data-k="' + p.k + '" ondragstart="onDragStart(event,\'' + p.k + '\')">'
      + '<div class="pn-icon" style="background:var(--' + p.color + '-bg)">'
      + '<span style="color:var(--' + (p.color === 'gray' ? 'gray2' : p.color) + ')">' + ico + '</span></div>'
      + '<div class="pn-info"><div class="pn-name">' + p.nombre + '</div>'
      + '<div class="pn-desc">' + p.desc + '</div></div></div>';
  }).join('');
}

const NODE_LABELS = {inicio:'Inicio',fija:'Frase fija',ia:'IA conversacional',pregunta:'Pregunta variable',timer:'Temporizador',resumen:'Resumen pedido',carta:'Evento · Carta'};
const NODE_INPUTS = {inicio:0,fija:1,ia:1,pregunta:1,timer:1,resumen:1,carta:0};
// Resumen tiene 2 salidas: output_1 = pago en efectivo (cierre) · output_2 = transferencia (comprobante)
const NODE_OUTPUTS = {inicio:1,fija:1,ia:1,pregunta:1,timer:1,resumen:2,carta:0};

let selectedNodeId = null;
let dragType = null;
let zoomLevel = 1;

pintarPaleta();
const container = document.getElementById('drawflow');
const editor = new Drawflow(container);
editor.reroute = true;
editor.reroute_fix_curvature = true;
editor.force_first_input = false;
editor.start();
window.editor = editor;
editor.zoom_value = 0.1; // incremento suave para el zoom con la rueda del mouse

function buildNodeHtml(type, data) {
  const name = data.nombre || NODE_LABELS[type];
  const active = data.activo !== false;
  /* El color y el subtitulo salen de la MISION, no del tipo de nodo. Antes
     "Pedir direccion", "Metodo de pago" y "Pedir nombre" se veian identicas
     —mismo icono amarillo, mismo "Pregunta variable" debajo— y solo se
     distinguian por el nombre que el dueño les hubiera escrito. */
  const pal = palDe(data);
  const sub = pal ? pal.nombre : NODE_LABELS[type];
  const col = pal ? pal.color : 'gray';
  return `<div class="df-node n-${type} mis-${col}">
    <div class="df-node-icon">${NODE_ICONS[type]}</div>
    <div class="df-node-body">
      <div class="df-node-name">${name}</div>
      <div class="df-node-type">${sub}</div>
    </div>
    <div class="df-node-dot ${active?'on':''}"></div>
  </div>`;
}

function addNode(type, x, y, data={}) {
  if(!data.nombre) data.nombre = NODE_LABELS[type];
  if(data.activo === undefined) data.activo = true;
  const html = buildNodeHtml(type, data);
  const id = editor.addNode(type, NODE_INPUTS[type], NODE_OUTPUTS[type], x, y, `n-${type}`, {type,...data}, html);
  return id;
}

function refreshNodeHtml(id) {
  const node = editor.getNodeFromId(id);
  if(!node) return;
  const html = buildNodeHtml(node.data.type, node.data);
  document.querySelector(`#node-${id} .df-node`).outerHTML = html;
  document.querySelector(`#node-${id}`).querySelector('.df-node').parentElement.innerHTML = html;
  const el = document.querySelector(`#node-${id} .drawflow_content_node`);
  if(el) el.innerHTML = buildNodeHtml(node.data.type, node.data);
}

/* Se arrastra la MISION (su clave), no el tipo de nodo: la caja nace ya
   sabiendo que dato captura y que papel juega. */
function onDragStart(e, k) { dragType = k; e.dataTransfer.setData('node', k); }

container.addEventListener('dragover', e => e.preventDefault());
container.addEventListener('drop', e => {
  e.preventDefault();
  if(!dragType) return;
  const rect = container.getBoundingClientRect();
  const zoom = editor.zoom;
  const x = (e.clientX - rect.left - editor.canvas_x) / zoom;
  const y = (e.clientY - rect.top  - editor.canvas_y) / zoom;
  const pal = PAL_POR_K[dragType];
  if (pal) {
    const d = { nombre: pal.nombre };
    if (pal.campo) d.campo = pal.campo;
    if (pal.rol)   d.rol   = pal.rol;
    /* Los mensajes con papel fijo (saludo, cierre, comprobante, envio) nacen
       en modo conversacional o fija segun lo que tiene mas sentido; el dueño
       lo cambia con el interruptor de siempre. */
    if (pal.rol === 'saludo') d.tipo = 'ia';
    addNode(pal.type, x, y, d);
  } else {
    addNode(dragType, x, y);
  }
  dragType = null;
});

// Zoom con la rueda del mouse: scroll arriba = acercar, scroll abajo = alejar
container.addEventListener('wheel', e => {
  e.preventDefault();
  zoom(e.deltaY < 0 ? 1 : -1);
}, { passive: false });

// Redibuja las líneas de conexión. Drawflow no las pinta al cargar/importar
// hasta que un nodo se mueve; forzamos el recálculo de cada nodo.
function refreshConnections() {
  try {
    const data = editor.drawflow && editor.drawflow.drawflow && editor.drawflow.drawflow.Home
      ? editor.drawflow.drawflow.Home.data : {};
    Object.keys(data).forEach(id => editor.updateConnectionNodes('node-' + id));
  } catch(e) { console.warn('refreshConnections falló', e); }
}

// El editor vive dentro de un iframe en una pestaña. Al cargar oculto, el canvas mide 0px
// y las líneas se calculan mal. Cuando el canvas pasa de oculto a visible (gana ancho),
// re-aplicamos el zoom y redibujamos las conexiones.
let _prevAncho = container.clientWidth;
if (window.ResizeObserver) {
  const _ro = new ResizeObserver(function(entries){
    const w = entries[0].contentRect.width;
    if (w > 0 && _prevAncho === 0) {
      try { editor.zoom_refresh(); } catch(e) {}
      refreshConnections();
    }
    _prevAncho = w;
  });
  _ro.observe(container);
}

editor.on('nodeSelected', id => {
  selectedNodeId = id;
  openPanel(id);
});
editor.on('nodeUnselected', () => { /* keep panel open until X */ });
editor.on('nodeMoved', () => markDirty());
editor.on('connectionCreated', () => markDirty());
editor.on('connectionRemoved', () => markDirty());
editor.on('nodeRemoved', () => { closePanel(); markDirty(); });

function openPanel(id) {

  /* Cada caja tiene una MISIÓN. El dueño elige por lo que hace, no por el

  const CAJAS = [

    { campo:'reserva',      titulo:'Reserva de mesa', ayuda:'Día, hora, cuántas personas y zona. Crea una RESERVA, no un pedido' },
    { campo:'factura',      titulo:'Datos de factura', ayuda:'Cédula o NIT, nombre y correo, para facturación electrónica' },
  ];
  const CAMPOS_UI = CAJAS.map(x => x.campo);
  const tituloCaja = (campo) => (CAJAS.find(x => x.campo === campo) || {}).titulo || campo;
  const ayudaCaja  = (campo) => (CAJAS.find(x => x.campo === campo) || {}).ayuda  || '';

      </select>
      <div style="margin-top:6px;font-size:11px;color:var(--text-3);line-height:1.5">Si este paso debe obtener un dato del pedido (ej. el upsell captura <b>adiciones</b>, el paso "¿qué deseas?" captura <b>producto</b>), selecciónalo aquí para que el bot lo ejecute en su lugar del flujo.</div>
    </div>`;
  }
  /* Opciones que tiene CUALQUIER caja: si es obligatoria, cuándo aplica y qué
     hacer si el cliente no la responde. Son las tres preguntas que se repiten

  if(['pregunta','ia','fija'].includes(d.type) && d.campo) {

          <input type="checkbox" ${d.obligatoria!==false?'checked':''} onchange="updateField(${id},'obligatoria',this.checked)">

  /* Caja de ENVÍO. No es un paso del pedido: el pedido ya existe y esto avisa

  if(['ia','fija'].includes(d.type) && d.rol_envio === true) {

    </div>`;
  }

  // Paso PAGO: puede ir después del resumen
  /* PREFERENCIAS: una sola caja para todo lo que el cliente pide "aparte".
     Se resolvio asi y no con un paso por cosa porque un paso solo para
     cubiertos seria absurdo: son todas observaciones sueltas del mismo
     pedido, y preguntarlas por separado alarga la conversacion sin ganar

  /* LA HORA NO ES UN PASO, ES UNA CARACTERISTICA de los pasos que la

  const bloqueHora = (d, id) => `
      <div class="cp-toggle-row" style="margin-top:14px">

  // Nodo EVENTO CARTA: mensaje que acompaña las imágenes del menú
  if(d.type === 'carta') {

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}

function updateField(id, field, val) {
  const node = editor.getNodeFromId(id);
  if(!node) return;
  node.data[field] = val;
  editor.updateNodeDataFromId(id, node.data);
  if(field === 'nombre') {
    document.getElementById('cpTitle').textContent = val || NODE_LABELS[node.data.type];
    const el = document.querySelector(`#node-${id} .drawflow_content_node`);
    if(el) el.innerHTML = buildNodeHtml(node.data.type, node.data);
  }
  if(field === 'activo') {
    const el = document.querySelector(`#node-${id} .drawflow_content_node`);
    if(el) el.innerHTML = buildNodeHtml(node.data.type, node.data);
  }
  markDirty();
}

function setTipo(id, tipo) {
  const node = editor.getNodeFromId(id);
  if(!node) return;
  node.data.tipo = tipo;
  editor.updateNodeDataFromId(id, node.data);
  renderPanelBody(id, node.data);
  markDirty();
}

function setCampo(id, campo) {
  const node = editor.getNodeFromId(id);
  if(!node) return;
  node.data.campo = campo;
  editor.updateNodeDataFromId(id, node.data);
  renderPanelBody(id, node.data);  // re-render: muestra las opciones del campo (carta, sub-preguntas…)
  markDirty();
}

function insertVar(id, v) {
  const ta = document.getElementById('cp-frase');
  if(!ta) return;
  const s = ta.selectionStart, e = ta.selectionEnd;
  ta.value = ta.value.slice(0,s) + v + ta.value.slice(e);
  ta.selectionStart = ta.selectionEnd = s + v.length;
  ta.focus();
  updateField(id,'frase',ta.value);
}
function insertVar2(id, v) {

function deleteSelected() {

function zoom(dir) {
  // API nativa de Drawflow: aplica el transform sobre editor.precanvas correctamente
  if (dir > 0) editor.zoom_in();
  else if (dir < 0) editor.zoom_out();
  const z = document.getElementById('zoomVal');
  if (z) z.textContent = Math.round(editor.zoom * 100) + '%';

let dirty = false;
function markDirty() {

  document.getElementById('saveStatus').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:12px;height:12px;color:var(--amber)"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Sin guardar`;

// Convierte un nodo del canvas en un paso del motor (solo si captura un slot).
const CAMPOS_SLOT = ['producto','tamano','tipo','direccion','pago','nombre','adiciones','preferencias','upsell','programado','reserva','factura'];
function pushPaso(d, pasos) {
  if (!d || !d.campo || !CAMPOS_SLOT.includes(d.campo)) return; // nodos sin variable no son pasos de pedido
  // modo: el toggle interno (tipo) manda; sin toggle, hereda del tipo de nodo (ia → conversacional)
  const esFija = d.tipo ? d.tipo === 'fija' : d.type !== 'ia';
  const paso = {
    campo: d.campo,
    modo: esFija ? 'fija' : 'conversacional',
    texto: d.frase || '',
    guia:  d.instrucciones || '',
    activo: d.activo !== false,
  };
  if (d.campo === 'producto') {
    paso.mostrar_menu = d.mostrar_menu !== false;
    paso.confirmar_cantidad = d.confirmar_cantidad === true;
  }
  if (d.campo === 'programado') {
    paso.hora_valida_horario = d.hora_valida_horario !== false;
    paso.hora_min_prep       = d.hora_min_prep == null ? 60 : Number(d.hora_min_prep) || 0;
    paso.hora_dias_max       = d.hora_dias_max == null ? 7  : Number(d.hora_dias_max) || 0;
    paso.hora_permite_ya     = d.hora_permite_ya !== false;
  }
  if (d.campo === 'reserva') {
    paso.reserva_pide = {
      personas: d.res_personas !== false,
      fecha:    d.res_fecha    !== false,
      hora:     d.res_hora     !== false,
      zona:     d.res_zona     === true,
      notas:    d.res_notas    === true,
    };
    paso.reserva_max_personas = d.res_max_personas == null ? 12 : Number(d.res_max_personas) || 1;
    paso.reserva_pendiente    = d.res_pendiente !== false;
    paso.hora_valida_horario  = d.hora_valida_horario !== false;
    paso.hora_min_prep        = d.hora_min_prep == null ? 60 : Number(d.hora_min_prep) || 0;
    paso.hora_dias_max        = d.hora_dias_max == null ? 7  : Number(d.hora_dias_max) || 0;
  }
  if (d.campo === 'factura') {
    paso.factura_pide = {
      documento: d.fact_documento !== false,
      razon:     d.fact_razon     !== false,
      correo:    d.fact_correo    !== false,
      direccion: d.fact_direccion === true,
    };
    /* Por defecto solo se pregunta a quien pide factura: pedirle el NIT a
       quien compra unas papas alarga la conversacion sin motivo. */
    paso.factura_solo_si_pide = d.fact_solo_si_pide !== false;
  }
  if (d.campo === 'preferencias') {
    /* Lo que el bot debe tener en cuenta. Se manda SIEMPRE el mapa completo,
       tambien lo apagado: el motor tiene que poder distinguir "no preguntes
       por cubiertos" de "este canvas es viejo y no sabe de cubiertos". */
    paso.pref_opciones = {
      plato:     d.pref_plato     !== false,
      domicilio: d.pref_domicilio === true,
      cubiertos: d.pref_cubiertos === true,
    };
  }
  if (d.campo === 'pago') paso.despues_resumen = d.despues_resumen === true;
  if (d.campo === 'upsell' && Array.isArray(d.upsell_productos)) paso.upsell_productos = d.upsell_productos;
  // Comunes a todas las cajas
  paso.obligatoria = d.obligatoria !== false;
  if (d.cuando && d.cuando !== 'siempre') paso.cuando = d.cuando;
  if (d.si_falla && d.si_falla !== 'insistir') paso.si_falla = d.si_falla;
  if (d.campo === 'direccion') {
    if (d.preg_incompleta) paso.preg_incompleta = d.preg_incompleta;
    if (d.preg_barrio)     paso.preg_barrio     = d.preg_barrio;
  }
  pasos.push(paso);
}

// Recorre el grafo desde el nodo "inicio" siguiendo las conexiones y devuelve
// el array ordenado de pasos para el motor (ia_config.flujo_pasos).
/* La caja de envío no es un paso del pedido, así que no va en flujo_pasos:
   se guarda aparte y la lee `cambiar-estado`. */
function exportarEnvio(data) {
  const nodes = (data.drawflow?.Home?.data) || {};
  for (const nid of Object.keys(nodes)) {
    const d = nodes[nid].data || {};
    if (d.rol_envio === true || d.rol === 'envio') {
      return {
        activo: d.activo !== false,
        estado: d.envio_estado || 'en_camino',
        usar_estados: d.envio_usar_estados !== false,
        frase: d.frase || '',
      };
    }
  }
  return null;
}

function exportarFlujoPasos(data) {
  const nodes = (data.drawflow?.Home?.data) || {};
  const entries = Object.entries(nodes);
  let startId = null;
  for (const [nid, n] of entries) { if (n.data && n.data.type === 'inicio') { startId = nid; break; } }
  const pasos = [];
  if (!startId) {
    // Sin nodo inicio: ordenar por posición horizontal
    entries.sort((a,b) => (a[1].pos_x||0) - (b[1].pos_x||0));
    for (const [, n] of entries) pushPaso(n.data, pasos);
    return pasos;
  }
  const visited = new Set();
  let curId = String(startId);
  while (curId && !visited.has(curId)) {
    visited.add(curId);
    const node = nodes[curId];
    if (!node) break;
    pushPaso(node.data, pasos);
    const conns = node.outputs?.output_1?.connections || [];
    curId = conns.length ? String(conns[0].node) : null;
  }
  // Nodos con slot que quedaron fuera del recorrido (ramas paralelas del grafo):
  // agregarlos ordenados por posición horizontal para que ningún paso se pierda.
  const faltantes = entries
    .filter(([nid, n]) => !visited.has(String(nid)) && n.data && n.data.campo)
    .sort((a,b) => (a[1].pos_x||0) - (b[1].pos_x||0));
  for (const [, n] of faltantes) pushPaso(n.data, pasos);
  return pasos;
}

// El primer nodo de mensaje SIN slot (Frase fija o IA conversacional) después de Inicio
// es el SALUDO del bot. Se guarda en ia_config.flujo_saludo para que el motor lo use
// como bienvenida (nada de saludos hardcoded en el código).
/* Busca una caja por su PAPEL. Devuelve su `data`, o null. */
function nodoConRol(data, rol) {
  const nodes = (data.drawflow?.Home?.data) || {};
  for (const n of Object.values(nodes)) {
    if (n.data && n.data.rol === rol) return n.data;
  }
  return null;
}

function exportarSaludo(data) {
  /* Si hay una caja Saludo, esa es — este donde este. */
  const conRol = nodoConRol(data, 'saludo');
  if (conRol) {
    const esFija = conRol.tipo ? conRol.tipo === 'fija' : false;
    return esFija
      ? { modo: 'fija', texto: conRol.frase || '' }
      : { modo: 'conversacional', guia: conRol.instrucciones || '' };
  }
  return exportarSaludoPorPosicion(data);
}

function exportarSaludoPorPosicion(data) {
  const nodes = (data.drawflow?.Home?.data) || {};
  const entries = Object.entries(nodes);
  let startId = null;
  for (const [nid, n] of entries) { if (n.data && n.data.type === 'inicio') { startId = nid; break; } }
  const seq = [];
  if (startId) {
    const visited = new Set(); let cur = String(startId);
    while (cur && !visited.has(cur)) {
      visited.add(cur);
      const node = nodes[cur]; if (!node) break;
      seq.push(node);
      const conns = node.outputs?.output_1?.connections || [];
      cur = conns.length ? String(conns[0].node) : null;
    }
  } else {
    entries.sort((a,b)=>(a[1].pos_x||0)-(b[1].pos_x||0));
    for (const [, n] of entries) seq.push(n);
  }
  for (const n of seq) {
    const d = n.data || {};
    if ((d.type === 'ia' || d.type === 'fija') && !d.campo) {
      const esFija = d.tipo ? d.tipo === 'fija' : d.type === 'fija';
      if (esFija) return { modo: 'fija', texto: d.frase || '' };
      return { modo: 'conversacional', guia: d.instrucciones || '' };
    }
    if (d.type === 'pregunta' || d.type === 'resumen') break; // el saludo va antes de los pasos
  }
  return null;
}

// Piezas extra del flujo: evento Carta + salidas del Resumen (efectivo→cierre, transferencia→comprobante)
function exportarExtras(data) {
  const nodes = (data.drawflow?.Home?.data) || {};
  const extras = {};
  const msgDe = (n) => {
    if (!n || !n.data) return null;
    const d = n.data;
    const esFija = d.tipo ? d.tipo === 'fija' : d.type !== 'ia';
    return esFija ? { modo:'fija', texto: d.frase || '' } : { modo:'conversacional', texto: d.frase || '', guia: d.instrucciones || '' };
  };
  /* Las cajas con papel propio mandan sobre la posicion. */
  const rCierre = nodoConRol(data, 'cierre');
  const rComp   = nodoConRol(data, 'comprobante');
  if (rCierre) extras.cierre      = msgDe({ data: rCierre });
  if (rComp)   extras.comprobante = msgDe({ data: rComp });

  for (const n of Object.values(nodes)) {
    const d = n.data || {};
    if (d.type === 'carta') { extras.carta = { texto: d.frase || '' }; }
    if (d.type === 'resumen') {
      const c1 = n.outputs?.output_1?.connections || [];
      const c2 = n.outputs?.output_2?.connections || [];
      if (!rCierre && c1.length) { const m = msgDe(nodes[String(c1[0].node)]); if (m) extras.cierre = m; }
      if (!rComp   && c2.length) { const m = msgDe(nodes[String(c2[0].node)]); if (m) extras.comprobante = m; }
    }
  }
  return Object.keys(extras).length ? extras : null;
}

async function saveFlow() {
  const data = editor.export();
  localStorage.setItem('cobrapos_flow', JSON.stringify(data));
  dirty = false;
  document.getElementById('saveStatus').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:12px;height:12px;color:var(--green)"><polyline points="20 6 9 17 4 12"/></svg> Guardando…`;

  // Guardar en Supabase: flujo_pasos (motor), flujo_saludo (bienvenida), flujo_canvas (diseño)
  // y frases.resumen. Si falla, se INFORMA — nunca un "Guardado" falso.
  try {
    const session = (await sb.auth.getSession()).data.session;
    if (!session) throw new Error('Sin sesión — inicia sesión para guardar el flujo');
    const meta = session.user.user_metadata || {};
    const branchId = meta.branch_id;
    if (!branchId) throw new Error('La sesión no tiene branch_id');
    const nodes = Object.values((data.drawflow?.Home?.data) || {});
    const { data: existing } = await sb.from('ia_config').select('frases').eq('branch_id', branchId).maybeSingle();
    let frases = existing?.frases || {};
    const resNode = nodes.find(n => n.data && n.data.type === 'resumen');
    if (resNode) {
      const rd = resNode.data;
      const tipoRes = rd.tipo || 'fija';
      frases = { ...frases, resumen: tipoRes === 'fija'
        ? { modo: 'fija', texto: rd.frase || RESUMEN_DEFAULT }
        : { modo: 'conversacional', guia: rd.instrucciones || '' } };
    }
    const payload = {
      branch_id: branchId,
      frases,
      flujo_pasos:  exportarFlujoPasos(data),
      flujo_envio:  exportarEnvio(data),
      flujo_saludo: exportarSaludo(data),
      flujo_extras: exportarExtras(data),
      flujo_canvas: data,
    };
    if (meta.tenant_id) payload.tenant_id = meta.tenant_id;
    const { error } = await sb.from('ia_config').upsert(payload, { onConflict: 'branch_id' });
    if (error) throw error;
  } catch(err) {
    console.error('Canvas: error guardando flujo en Supabase', err);
    document.getElementById('saveStatus').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:12px;height:12px;color:#e5484d"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> Error al guardar: ${(err && err.message) ? String(err.message).slice(0,60) : 'revisa la consola'}`;
    return;
  }

  document.getElementById('saveStatus').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:12px;height:12px;color:var(--green)"><polyline points="20 6 9 17 4 12"/></svg> Guardado`;
}

editor.on('zoom', val => { document.getElementById('zoomVal').textContent = Math.round(val*100)+'%'; });

// Migración de canvas guardados con versiones anteriores:
// el nodo Resumen ahora tiene 2 salidas (efectivo / transferencia) — agregarlas si faltan.
function migrarCanvas(fc) {
  try {
    const nodes = fc?.drawflow?.Home?.data || {};
    for (const n of Object.values(nodes)) {
      if (n.data && n.data.type === 'resumen') {
        n.outputs = n.outputs || {};
        if (!n.outputs.output_1) n.outputs.output_1 = { connections: [] };
        if (!n.outputs.output_2) n.outputs.output_2 = { connections: [] };
      }
    }
  } catch(e) { /* si falla, se importa tal cual */ }
  return fc;
}

// Cargar flujo: Supabase (flujo_canvas = fuente de verdad) > localStorage > demo
(async () => {
  let loaded = false;
  try {
    const session = (await sb.auth.getSession()).data.session;
    if (session) {
      const branchId = session.user.user_metadata.branch_id;
      const { data: cfg } = await sb.from('ia_config').select('flujo_canvas, frases').eq('branch_id', branchId).maybeSingle();
      if (cfg?.flujo_canvas && cfg.flujo_canvas.drawflow) {
        try { editor.import(migrarCanvas(cfg.flujo_canvas)); loaded = true; } catch(e) { console.warn('import flujo_canvas falló', e); }
      }
      // Si el diseño no traía el resumen actualizado, sincronizar frases.resumen sobre el nodo resumen
      const r = cfg?.frases?.resumen;
      if (loaded && r) {
        const flowData = editor.export();
        const allNodes = Object.entries((flowData.drawflow?.Home?.data) || {});
        const [resNodeId, resNode] = allNodes.find(([,n]) => n.data && n.data.type === 'resumen') || [];
        if (resNodeId && resNode) {
          const updatedData = { ...resNode.data };
          if (r.modo === 'fija') { updatedData.tipo = 'fija'; updatedData.frase = r.texto || RESUMEN_DEFAULT; }
          else { updatedData.tipo = 'ia'; updatedData.instrucciones = r.guia || ''; }
          editor.updateNodeDataFromId(resNodeId, updatedData);
        }
      }
    }
  } catch(err) {
    console.warn('Canvas: error cargando flujo desde Supabase', err);
  }
  if (!loaded) {
    const saved = localStorage.getItem('cobrapos_flow');
    if (saved) { try { editor.import(migrarCanvas(JSON.parse(saved))); loaded = true; } catch(e) { /* cae a demo */ } }
  }
  if (!loaded) buildDemo();
  // Tras importar: aplicar el zoom al canvas y redibujar las líneas
  // (Drawflow no pinta el transform ni las conexiones hasta que se mueve un nodo).
  else { setTimeout(() => { try { editor.zoom_refresh(); } catch(e){} refreshConnections(); }, 120); }
})();
